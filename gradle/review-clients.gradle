    renderTypeProfileClient: [dir: 'build/render-type-profile', user: 'ProfileReview', memory: ['4G', '6G'], size: review,
                              props: ['hemomancy.renderTypeProfile': 'true',
                                      'hemomancy.renderTypeProfileLabel': gradleOr('profileLabel', 'after')]],
    // -Pmausoleum=<saint> (default all), -PmausoleumNatural=true to find naturally generated complexes instead.
    mausoleumReviewClient: [dir: 'build/mausoleum-review', user: 'MausoleumReview', driver: false, size: review,
                            props: ['hemomancy.mausoleumReview': 'true',
                                    'hemomancy.mausoleumReview.saint': gradleOr('mausoleum', 'all'),
                                    'hemomancy.mausoleumReview.natural': gradleOr('mausoleumNatural', 'false'),
                                    'hemomancy.mausoleumReview.seed': gradleOr('mausoleumSeed', '20261028')]],
    // Brined Court Seats (Track 7): -PbrinedSeatSeed=<seed> (default 42); screenshots in build/brined-seat-review/screenshots.
    brinedSeatReviewClient: [dir: 'build/brined-seat-review', user: 'SeatReview', driver: false, size: review,
                             props: ['hemomancy.brinedSeatReview': 'true',
                                     'hemomancy.brinedSeatReview.seed': gradleOr('brinedSeatSeed', '42'),
                                     // Track 5: -PbrinedSeatChartOnly=true shoots only the Relay Chart stops.
                                     'hemomancy.brinedSeatReview.chartOnly': gradleOr('brinedSeatChartOnly', 'false')]],
    // Brined Court outposts and signs (Track 8): -PbrinedOutpostSeed=<seed> (default 42); build/brined-outpost-review/screenshots.
    // Blood Temple and Harbinger Outpost in a superflat world (HarbingerSitesClientReview); build/harbinger-sites-review/screenshots.
    harbingerSitesReviewClient: [dir: 'build/harbinger-sites-review', user: 'SitesReview', driver: false, size: review,
                                 props: ['hemomancy.harbingerSitesReview': 'true']],
    brinedOutpostReviewClient: [dir: 'build/brined-outpost-review', user: 'OutpostReview', driver: false, size: review,
                                props: ['hemomancy.brinedOutpostReview': 'true',
                                        'hemomancy.brinedOutpostReview.seed': gradleOr('brinedOutpostSeed', '42')]],
    // Brined Court members (Track 9): -PcourtNpcSeed=<seed> (default 42); build/court-npc-review/screenshots.
    courtNpcReviewClient: [dir: 'build/court-npc-review', user: 'CourtNpcReview', driver: false, size: review,
                           props: ['hemomancy.courtNpcReview': 'true',
                                   'hemomancy.courtNpcReview.seed': gradleOr('courtNpcSeed', '42')]],
    // Brined Court presences (Track 10): -PcourtPresenceSeed=<seed> (default 42); build/court-presence-review/screenshots.
    courtPresenceReviewClient: [dir: 'build/court-presence-review', user: 'PresenceReview', driver: false, size: review,
                                props: ['hemomancy.courtPresenceReview': 'true',
                                        'hemomancy.courtPresenceReview.seed': gradleOr('courtPresenceSeed', '42')]],
    // PT-67 on a world with the Chamber of Will: the rite's check, attunement and a real visit (ChamberRiteClientReview);
    // drop {"op":"create","name":"ChamberRite","seed":42} after startup and read CHAMBER_RITE_REVIEW in logs/latest.log
    chamberRiteReviewClient: [dir: 'build/chamber-rite-review', user: 'ChamberRite', size: review,
                              props: ['hemomancy.chamberRiteReview': 'true']],
    successionReviewClient: [dir: 'build/succession-client', user: 'SuccessionReview',
                             props: ['hemomancy.successionReview': 'true']],
    successionObserverClient: [dir: 'build/succession-observer', user: 'SucObserver', memory: ['2G', '4G'],
                               args: ['--quickPlayMultiplayer', 'localhost:25568']],
    // Core-loop round two P11: how another player sees a caster. The host publishes its world on port 25581 and the
    // observer joins it; start both through tools/review/review-onlooker.ps1 (one Gradle call, then bare java).
    onlookerReviewClient: [dir: 'build/onlooker-host', user: 'OnlookHost', size: review,
                           bare: true, props: ['hemomancy.onlookerReview': 'true',
                                   'hemomancy.onlookerReview.only': gradleOr('onlookerOnly', '')]],
    onlookerObserverClient: [dir: 'build/onlooker-observer', user: 'OnlookWatch', memory: ['2G', '4G'], size: review,
                             bare: true, props: ['hemomancy.onlookerObserver': 'true'],
                             args: ['--quickPlayMultiplayer', '127.0.0.1:25581']],
]

reviewClients.each { name, spec ->
    def run = neoForge.runs.maybeCreate(name)
    run.client()
    run.gameDirectory = file(spec.dir)
    run.additionalRuntimeClasspathConfiguration.extendsFrom(configurations.clientLocalRuntime)
    def memory = spec.memory ?: ['2G', '6G']
    run.jvmArguments.addAll("-Xms${memory[0]}".toString(), "-Xmx${memory[1]}".toString())
    if (spec.driver != false) run.systemProperty 'hemomancy.gameplayDriver', 'true'
    spec.props?.each { key, value -> run.systemProperty key, value }
    run.programArguments.addAll '--username', spec.user
    spec.args?.each { run.programArguments.add it }
    if (spec.size) run.programArguments.addAll '--width', spec.size[0].toString(), '--height', spec.size[1].toString()
    // A fresh game dir opens on the accessibility onboarding screen, which strands a driven client; every review run
    // marks it seen in options.txt before launch, so no harness has to dismiss it. The One Probe's look-at tooltip is
    // turned off too, so it never sits over a capture.
    def gameDir = file(spec.dir)
    tasks.matching { it.name == 'run' + name.capitalize() }.configureEach {
        doFirst {
            skipAccessibilityOnboarding(gameDir)
            hideProbeTooltip(gameDir)
        }
    }
}

static void hideProbeTooltip(File gameDir) {
    def config = new File(gameDir, 'config/theoneprobe-common.toml')
    config.parentFile.mkdirs()
    def lines = config.exists() ? config.readLines('UTF-8').findAll { !it.startsWith('needsProbe') } : []
    lines << 'needsProbe = 2'
    config.setText(lines.join('\n') + '\n', 'UTF-8')
}

static void skipAccessibilityOnboarding(File gameDir) {
    gameDir.mkdirs()
    def options = new File(gameDir, 'options.txt')
    def lines = options.exists() ? options.readLines('UTF-8').findAll { !it.startsWith('onboardAccessibility:') } : []
    lines << 'onboardAccessibility:false'
    options.setText(lines.join('\n') + '\n', 'UTF-8')
}

// Bare-java launches (tools/review/review-onlooker.ps1): what the run task adds when it executes (its classpath and
// the mod folders), as a java argument file. Paths are quoted with forward slashes so the java launcher reads them whole.
reviewClients.findAll { name, spec -> spec.bare }.each { name, spec ->
    def runTaskName = 'run' + name.capitalize()
    tasks.register('write' + name.capitalize() + 'Classpath') {
        group = 'review'
        description = "Writes the classpath and mod folders of ${name} as a java argument file for bare-java launches."
        def out = layout.buildDirectory.file("moddev/${name}RunClasspath.txt")
        outputs.file(out)
        outputs.upToDateWhen { false }
        dependsOn { tasks.named(runTaskName).get().classpathProvider }
        doLast {
            def run = tasks.named(runTaskName).get()
            def path = run.classpathProvider.files.collect { it.absolutePath.replace('\\', '/') }.join(File.pathSeparator)
            def lines = ['-classpath', '"' + path + '"']
            run.allJvmArgs.findAll { it.startsWith('-Dfml.modFolders=') }.each { lines << ('"' + it.replace('\\', '/') + '"') }
            out.get().asFile.text = lines.join('\n') + '\n'
        }
    }
}
