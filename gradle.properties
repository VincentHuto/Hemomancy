org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# ------------------------------------------------------------------------------
#  NeoForge 1.21.1 port
#  MC 1.21.1 | NeoForge 21.1.x | Java 21
# ------------------------------------------------------------------------------

minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)

# NeoForge replaces Forge; dependency declared as net.neoforged:neoforge:${neoforge_version}
neoforge_version=21.1.172
neoforge_version_range=[21.1,)
# NeoForge loader 4+ covers all NeoForge 21.x releases (javafml 4+)
loader_version_range=[4,)

# Parchment human-readable mappings (used via NeoGradle subsystems.parchment)
mapping_channel=parchment
mapping_version=2024.11.17-1.21.1

# -- Dependency versions -------------------------------------------------------
# TerraBlender NeoForge 1.21.1 build
terrablender_version=4.1.0.15
# GeckoLib NeoForge 1.21.1 build (latest confirmed: 4.8.3, Jan 2026)
geckolib_version=4.8.3

# TODO: uncomment once NeoForge 1.21 builds are confirmed available
# curios_version=X.X.X
# jei_version=X.X.X
# create_version=X.X.X
# ponder_version=X.X.X
# flywheel_version=X.X.X
# registrate_version=X.X.X

# -- Mod Properties ------------------------------------------------------------
mod_id=hemomancy
mod_name=hemomancy
mod_license=All Rights Reserved
# Version suffix indicates NeoForge port target
mod_version=5.0.1-neoforge.1.21.1.0
mod_group_id=com.vincenthuto.hemomancy
mod_authors=VincentHuto
mod_description=Channel the carnal fluid flowing through your veins, dont let it go to waste.Use it to crush your enemies, or boost yourself!After all its just sitting there!~Huto
# MC 1.21.1 resource-pack format
pack_format_number=34
