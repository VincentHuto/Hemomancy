minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)

# NeoForge replaces Forge; dependency declared as net.neoforged:neoforge:${neoforge_version}
neo_version=21.1.172
neo_version_range=[21.1,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

# Parchment human-readable mappings (used via NeoGradle subsystems.parchment)
mapping_channel=parchment
parchment_mappings_version=2024.11.17

# ── Dependency versions ────────────────────────────────────────────────────────
# TerraBlender NeoForge 1.21.1 build
terrablender_version=4.1.0.8
# GeckoLib NeoForge 1.21.1 build
geckolib_version=4.8.4
hutoslib_version=7.3.0
