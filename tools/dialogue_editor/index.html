<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hemomancy Dialogue Tree Editor</title>
<style>
/* ── Reset & base ─────────────────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
body{display:flex;flex-direction:column;height:100vh;background:#110606;
  color:#e0cba8;font:13px/1.45 'Consolas','Courier New',monospace;overflow:hidden}

/* ── Top bar ──────────────────────────────────────────────────────────────── */
#topbar{display:flex;align-items:center;gap:6px;padding:7px 12px;
  background:#2a0808;border-bottom:2px solid #7a1515;flex-shrink:0}
#topbar .logo{font-size:15px;font-weight:bold;color:#cc2222;margin-right:auto;
  letter-spacing:.5px}
.btn{background:#3a1010;color:#e0cba8;border:1px solid #7a1515;padding:4px 10px;
  cursor:pointer;border-radius:3px;font:inherit;white-space:nowrap}
.btn:hover{background:#541515}
.btn.green{border-color:#2d8c44;color:#4dbf6a}
.btn.green:hover{background:#1a4028}
.btn.blue{border-color:#2255aa;color:#4488dd}
.btn.blue:hover{background:#0d1e3d}
#topbar select{background:#2a0808;color:#e0cba8;border:1px solid #7a1515;
  padding:4px 8px;font:inherit;border-radius:3px;max-width:240px}

/* ── Main 3-column layout ────────────────────────────────────────────────── */
#main{display:flex;flex:1;overflow:hidden}

/* ── Left sidebar ─────────────────────────────────────────────────────────── */
#sidebar{width:190px;background:#1a0808;border-right:1px solid #4a1010;
  overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column}
#sidebar-header{padding:7px 10px;font-size:11px;color:#7a3030;text-transform:uppercase;
  letter-spacing:.8px;border-bottom:1px solid #3a1010;background:#220a0a;flex-shrink:0}
#tree-list{flex:1;padding:6px 5px;overflow-y:auto}
.tree-entry{padding:5px 7px;cursor:pointer;border-radius:3px;margin-bottom:3px;
  border:1px solid transparent;font-size:12px;line-height:1.35}
.tree-entry:hover{background:#2e1010}
.tree-entry.active{background:#4a1010;border-color:#9a2020}
.tree-entry .mname{color:#d4802a;font-weight:bold}
.tree-entry .variant-badge{font-size:10px;color:#886640;margin-left:3px}
.tree-entry .theme-dot{display:inline-block;width:6px;height:6px;
  border-radius:50%;margin-right:5px;vertical-align:middle}
.dot-BLOOD{background:#cc2222}.dot-UNSTAINED{background:#3377cc}.dot-FUNGAL{background:#cc7700}
.node-count{font-size:10px;color:#664444;float:right}

/* ── Canvas area ─────────────────────────────────────────────────────────── */
#canvas-outer{flex:1;overflow:auto;position:relative;background:#0e0505;cursor:default}
#canvas-inner{position:relative;min-width:1200px;min-height:800px}
#edge-svg{position:absolute;top:0;left:0;pointer-events:none;overflow:visible}

/* ── Nodes ───────────────────────────────────────────────────────────────── */
.dnode{position:absolute;width:230px;border-radius:5px;cursor:pointer;
  user-select:none;box-shadow:0 2px 8px #00000066;transition:box-shadow .15s}
.dnode:hover{box-shadow:0 2px 14px #cc333344}
.dnode.selected{box-shadow:0 0 0 2px #ff4444,0 2px 14px #cc333366}
.dnode.start-node{box-shadow:0 0 0 2px #cc8822,0 2px 10px #cc882233}
/* BLOOD theme */
.dnode{background:#27100e;border:1.5px solid #7a2020}
.dnode .nh{background:#4a1515;color:#e0a060;font-size:12px;font-weight:bold;
  padding:4px 8px;border-radius:3px 3px 0 0;display:flex;justify-content:space-between;align-items:center}
.dnode .nh .badge{font-size:10px;padding:1px 5px;border-radius:2px;background:#cc8822;color:#1a0a00}
/* UNSTAINED theme overrides */
.dnode.t-UNSTAINED{background:#0c1a2e;border-color:#2255a0}
.dnode.t-UNSTAINED .nh{background:#0e2448;color:#80b0ee}
.dnode.t-UNSTAINED .nh .badge{background:#4488cc;color:#010810}
.dnode.t-UNSTAINED.selected{box-shadow:0 0 0 2px #4488ff,0 2px 14px #4488ff44}
.dnode.t-UNSTAINED.start-node{box-shadow:0 0 0 2px #4488cc,0 2px 10px #4488cc33}
/* FUNGAL theme overrides */
.dnode.t-FUNGAL{background:#1a1200;border-color:#885500}
.dnode.t-FUNGAL .nh{background:#2e1e00;color:#ddaa44}
.dnode.t-FUNGAL .nh .badge{background:#cc8800;color:#100a00}
.dnode.t-FUNGAL.selected{box-shadow:0 0 0 2px #ffaa00,0 2px 14px #cc880044}

/* Node body sections */
.dnode .nl{padding:5px 8px;border-bottom:1px solid #3a1a1a;font-size:11px}
.dnode .nl .lk{color:#7a5050;font-size:10px;margin-top:1px}
.dnode .nl .lt{color:#c8a060;font-style:italic;line-height:1.3}
.dnode.t-UNSTAINED .nl{border-color:#1a2e4a}.dnode.t-UNSTAINED .nl .lt{color:#90b8e0}
.dnode.t-FUNGAL .nl{border-color:#3a2a00}.dnode.t-FUNGAL .nl .lt{color:#d4a040}
.dnode .no{padding:4px 8px 6px}
.dnode .or{font-size:11px;padding:2px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dnode .or.to-node{color:#aad060}.dnode .or.to-end{color:#666}.dnode .or.has-ev{color:#d0a060}

/* ── Right editor panel ───────────────────────────────────────────────────── */
#epanel{width:290px;background:#1a0808;border-left:1px solid #4a1010;
  overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column}
#ep-idle{padding:16px 12px;color:#5a3030;font-style:italic;font-size:12px}
#ep-content{padding:10px 12px;display:none}
.es{margin-bottom:11px}
.el{font-size:11px;color:#8a4040;text-transform:uppercase;letter-spacing:.6px;
  margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.ei{width:100%;background:#110505;border:1px solid #4a1a1a;color:#e0cba8;
  padding:4px 6px;font:inherit;border-radius:3px;font-size:12px}
.ei:focus{outline:none;border-color:#aa2222}
.ei.mono{font-family:'Consolas','Courier New',monospace}
.eitem{background:#220e0e;border:1px solid #3a1a1a;border-radius:3px;
  padding:6px 7px;margin-bottom:6px}
.erow{display:flex;gap:4px;align-items:flex-start}
.erow .ei{flex:1;min-width:0}
.esub{font-size:10px;color:#7a4040;margin:3px 0 2px}
.trans{font-size:10px;color:#b08840;font-style:italic;margin:2px 0 3px;padding:2px 5px;
  background:#1e1500;border-radius:2px;border-left:2px solid #885500}
.bs{background:#2e1010;border:1px solid #6a2020;color:#e0cba8;padding:3px 8px;
  cursor:pointer;border-radius:3px;font:inherit;font-size:11px;white-space:nowrap}
.bs:hover{background:#4a1a1a}
.bs.red{color:#cc4444;border-color:#882222}
.bs.add{color:#44bb66;border-color:#226633}
.bs.full{width:100%;margin-top:5px;padding:5px}
.sep{border:none;border-top:1px solid #3a1010;margin:10px 0}

/* ── Empty state prompt ───────────────────────────────────────────────────── */
#empty-canvas{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;pointer-events:none;color:#3a1a1a;
  font-size:14px;gap:8px}
#empty-canvas p{font-size:12px;color:#2a1010}

/* Keep file inputs off-screen but clickable by script in stricter browsers */
.stealth-file{position:fixed;left:-10000px;top:auto;width:1px;height:1px;opacity:0;pointer-events:none}
</style>
</head>
<body>

<div id="topbar">
  <span class="logo">🩸 Dialogue Tree Editor</span>
  <button class="btn" id="btnLoadJSON">📂 Load JSON</button>
  <button class="btn blue" id="btnLoadLang">📖 Load lang</button>
  <label style="color:#7a4040;font-size:12px">Tree:</label>
  <select id="treeSelect" style="display:none"></select>
  <button class="btn" id="btnAddNode" style="display:none">＋ Node</button>
  <button class="btn" id="btnRelayout" style="display:none">⟳ Relayout</button>
  <button class="btn green" id="btnExport" style="display:none">💾 Export JSON</button>
  <input type="file" id="jsonInput" class="stealth-file" accept=".json">
  <input type="file" id="langInput" class="stealth-file" accept=".json,.lang,.txt">
</div>

<div id="main">
  <div id="sidebar">
    <div id="sidebar-header">Trees</div>
    <div id="tree-list"><span style="color:#4a2020;font-size:11px;padding:8px;display:block">Load a JSON file to begin.</span></div>
  </div>

  <div id="canvas-outer">
    <div id="canvas-inner">
      <svg id="edge-svg"></svg>
      <div id="empty-canvas">
        <span>No tree loaded</span>
        <p>Use <strong>📂 Load JSON</strong> above, then click a tree in the list.</p>
      </div>
    </div>
  </div>

  <div id="epanel">
    <div id="ep-idle">Click a node to edit it.</div>
    <div id="ep-content"></div>
  </div>
</div>

<script>
'use strict';

// ── State ──────────────────────────────────────────────────────────────────
const S = {
  data:     null,   // full JSON object
  lang:     {},     // key → English text
  tidx:     -1,     // current tree index
  pos:      {},     // nodeId → {x,y}
  sel:      null,   // selected nodeId
  dirty:    false,
};

const NODE_W   = 230;
const COL_GAP  = 90;
const ROW_GAP  = 24;
const MARGIN   = 30;

// ── File loading ───────────────────────────────────────────────────────────
document.getElementById('btnLoadJSON').onclick = () => openPicker('json');
document.getElementById('btnLoadLang').onclick = () => openPicker('lang');

async function openPicker(kind) {
  const inputId = kind === 'json' ? 'jsonInput' : 'langInput';
  const input = document.getElementById(inputId);
  if (!input) return;

  try {
    // Single picker path avoids duplicate dialogs and cross-browser API quirks.
    if (typeof input.showPicker === 'function') input.showPicker();
    else input.click();
  } catch (err) {
    console.error('Unable to open file picker', err);
    alert('Could not open file picker in this browser. Use a modern browser (Edge/Chrome/Firefox) and try again.');
  }
}

function loadJsonFromFile(f) {
  if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      S.data  = JSON.parse(ev.target.result);
      S.tidx  = -1; S.sel = null; S.pos = {};
      renderSidebar();
      buildTreeSelect();
      ['treeSelect','btnAddNode','btnRelayout','btnExport'].forEach(id => {
        document.getElementById(id).style.display = (S.data?.trees?.length ? '' : 'none');
      });
      if (S.data?.trees?.length) selectTree(0);
    } catch(err) { alert('Bad JSON: ' + err.message); }
  };
  r.readAsText(f);
}

function loadLangFromFile(f) {
  if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const parsed = parseLangContent(ev.target.result);
      applyLangMap(parsed);
    } catch(err) { alert('Bad lang file (.json/.lang): ' + err.message); }
  };
  r.readAsText(f);
}

function parseLangContent(text) {
  const src = (text || '').trim();
  if (!src) return {};

  // Supports modern JSON lang files.
  if (src.startsWith('{')) {
    const obj = JSON.parse(src);
    return (obj && typeof obj === 'object') ? obj : {};
  }

  // Supports legacy key=value .lang files.
  const out = {};
  src.split(/\r?\n/).forEach(line => {
    const trimmed = line.trim();
    if (!trimmed || trimmed.startsWith('#') || trimmed.startsWith('//')) return;
    const eq = trimmed.indexOf('=');
    if (eq <= 0) return;
    const key = trimmed.slice(0, eq).trim();
    const val = trimmed.slice(eq + 1).trim();
    if (key) out[key] = val;
  });
  return out;
}

function applyLangMap(map) {
  S.lang = map || {};
  if (S.tidx >= 0) renderGraph();
  if (S.sel) renderEditor();
}

async function attemptAutoLoadLang() {
  const candidates = ['en_us.lang', 'en_us.json'];
  for (const file of candidates) {
    try {
      const res = await fetch(file, { cache: 'no-store' });
      if (!res.ok) continue;
      const text = await res.text();
      const parsed = parseLangContent(text);
      if (Object.keys(parsed).length > 0) {
        applyLangMap(parsed);
        console.info(`Loaded localization from ${file}`);
        return;
      }
    } catch (_err) {
      // Common when opened via file:// or stricter browser policies.
    }
  }
}

document.getElementById('jsonInput').addEventListener('change', e => {
  const f = e.target.files[0];
  loadJsonFromFile(f);
  e.target.value = '';
});

document.getElementById('langInput').addEventListener('change', e => {
  const f = e.target.files[0];
  loadLangFromFile(f);
  e.target.value = '';
});

document.getElementById('btnAddNode').onclick    = addNewNode;
document.getElementById('btnRelayout').onclick   = () => { computeLayout(); renderGraph(); };
document.getElementById('btnExport').onclick     = exportJSON;
document.getElementById('treeSelect').onchange   = e => selectTree(+e.target.value);

// ── Sidebar & select ───────────────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('tree-list');
  list.innerHTML = '';
  if (!S.data?.trees?.length) return;
  S.data.trees.forEach((t, i) => {
    const d  = document.createElement('div');
    const th = t.theme || 'BLOOD';
    const lbl = t.method + (t.variant !== undefined ? `<span class="variant-badge">#${t.variant}</span>` : '');
    d.className = 'tree-entry' + (i===S.tidx?' active':'');
    d.innerHTML =
      `<span class="theme-dot dot-${th}"></span><span class="mname">${lbl}</span>` +
      `<span class="node-count">${(t.nodes||[]).length}n</span>`;
    d.onclick = () => selectTree(i);
    list.appendChild(d);
  });
}

function buildTreeSelect() {
  const sel = document.getElementById('treeSelect');
  sel.innerHTML = '';
  (S.data?.trees||[]).forEach((t,i) => {
    const o = document.createElement('option');
    o.value = i;
    o.textContent = t.method + (t.variant !== undefined ? ` #${t.variant}` : '');
    sel.appendChild(o);
  });
}

function selectTree(i) {
  S.tidx = i; S.sel = null;
  document.getElementById('treeSelect').value = i;
  renderSidebar();
  computeLayout();
  renderGraph();
  renderEditor();
}

// ── Layout ─────────────────────────────────────────────────────────────────
function computeLayout() {
  if (S.tidx < 0 || !S.data) return;
  const tree  = S.data.trees[S.tidx];
  const nodes = tree.nodes || [];
  const startId = tree.start_node || (nodes[0]?.id);

  // BFS to assign column depths
  const depth = {};
  const q = [];
  if (startId) { depth[startId] = 0; q.push(startId); }
  const seen = new Set();
  while (q.length) {
    const id = q.shift();
    if (seen.has(id)) continue;
    seen.add(id);
    const nd = nodes.find(n => n.id === id);
    if (!nd) continue;
    const d = depth[id] ?? 0;
    for (const o of (nd.options||[])) {
      if (o.next && !(o.next in depth)) { depth[o.next] = d+1; q.push(o.next); }
    }
  }
  // Orphan nodes go in last column
  let maxD = Math.max(0, ...Object.values(depth));
  nodes.forEach(n => { if (!(n.id in depth)) { depth[n.id] = ++maxD; } });

  // Group by column
  const cols = {};
  for (const [id, d] of Object.entries(depth)) {
    (cols[d] = cols[d]||[]).push(id);
  }

  // Keep existing manually-dragged positions; only place un-positioned nodes
  const placed = new Set(Object.keys(S.pos));
  const newPos = {};
  for (const [dStr, ids] of Object.entries(cols)) {
    const col  = +dStr;
    const x    = col * (NODE_W + COL_GAP) + MARGIN;
    let   y    = MARGIN;
    ids.forEach(id => {
      if (!placed.has(id)) {
        newPos[id] = {x, y};
        y += estimateH(nodes.find(n=>n.id===id)) + ROW_GAP;
      } else {
        y += estimateH(nodes.find(n=>n.id===id)) + ROW_GAP;
      }
    });
  }
  // Merge: keep existing, add new
  Object.assign(S.pos, newPos);
}

function estimateH(nd) {
  if (!nd) return 80;
  return 32 + (nd.lines||[]).length * 30 + (nd.options||[]).length * 20 + 8;
}

// ── Graph rendering ─────────────────────────────────────────────────────────
function clearCanvas() {
  document.querySelectorAll('.dnode').forEach(e=>e.remove());
  const svg = document.getElementById('edge-svg');
  [...svg.children].forEach(c=>{ if(c.tagName!=='defs') c.remove(); });
  document.getElementById('edge-svg').innerHTML = `
    <defs>
      <marker id="ah-b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
        <path d="M0 0 L8 3 L0 6Z" fill="#aa3322"/>
      </marker>
      <marker id="ah-u" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
        <path d="M0 0 L8 3 L0 6Z" fill="#3366aa"/>
      </marker>
      <marker id="ah-f" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
        <path d="M0 0 L8 3 L0 6Z" fill="#aa6600"/>
      </marker>
    </defs>`;
}

function renderGraph() {
  clearCanvas();
  document.getElementById('empty-canvas').style.display = S.tidx < 0 ? '' : 'none';
  if (S.tidx < 0 || !S.data) return;

  const tree  = S.data.trees[S.tidx];
  const nodes = tree.nodes || [];
  const inner = document.getElementById('canvas-inner');

  // Expand canvas
  let maxX = 900, maxY = 600;
  nodes.forEach(nd => {
    const p = S.pos[nd.id]; if (!p) return;
    maxX = Math.max(maxX, p.x + NODE_W + 80);
    maxY = Math.max(maxY, p.y + estimateH(nd) + 60);
  });
  inner.style.width  = maxX + 'px';
  inner.style.height = maxY + 'px';
  const svg = document.getElementById('edge-svg');
  svg.setAttribute('width',  maxX); svg.setAttribute('height', maxY);

  // Render node divs
  nodes.forEach(nd => inner.appendChild(makeNodeEl(nd, tree)));

  // Render edges after DOM settles
  requestAnimationFrame(() => renderEdges(tree));
}

function makeNodeEl(nd, tree) {
  const pos   = S.pos[nd.id] || {x:MARGIN, y:MARGIN};
  const theme = tree.theme || 'BLOOD';
  const div   = document.createElement('div');
  div.className = `dnode t-${theme}${nd.id===tree.start_node?' start-node':''}${nd.id===S.sel?' selected':''}`;
  div.dataset.id = nd.id;
  div.style.cssText = `left:${pos.x}px;top:${pos.y}px;width:${NODE_W}px`;

  // Header
  const hdr = document.createElement('div');
  hdr.className = 'nh';
  hdr.innerHTML = `<span>${nd.id}</span>${nd.id===tree.start_node?'<span class="badge">START</span>':''}`;
  div.appendChild(hdr);

  // Lines
  if ((nd.lines||[]).length) {
    const nl = document.createElement('div'); nl.className = 'nl';
    nd.lines.forEach(key => {
      const tx = S.lang[key];
      nl.innerHTML += tx
        ? `<div class="lt">"${trunc(tx,38)}"</div><div class="lk">${key}</div>`
        : `<div class="lk">${trunc(key,42)}</div>`;
    });
    div.appendChild(nl);
  }

  // Options
  if ((nd.options||[]).length) {
    const no = document.createElement('div'); no.className = 'no';
    nd.options.forEach(o => {
      const row = document.createElement('div');
      const label = S.lang[o.text] ? trunc(S.lang[o.text],28) : trunc(o.text.split('.').pop(),28);
      if (o.next)        { row.className='or to-node'; row.textContent=`→ ${label}`; }
      else if (o.event)  { row.className='or has-ev';  row.textContent=`⚡ ${label}`; }
      else               { row.className='or to-end';  row.textContent=`✕ ${label}`; }
      no.appendChild(row);
    });
    div.appendChild(no);
  }

  div.addEventListener('mousedown', e => startDrag(e, nd.id, pos));
  div.addEventListener('click', e => { if (!wasDragging) selectNode(nd.id); });
  return div;
}

// ── Edges ──────────────────────────────────────────────────────────────────
function themeColor(th)  { return {BLOOD:'#aa3322',UNSTAINED:'#3366aa',FUNGAL:'#aa6600'}[th]||'#aa3322'; }
function themeArrow(th)  { return {BLOOD:'ah-b',UNSTAINED:'ah-u',FUNGAL:'ah-f'}[th]||'ah-b'; }

function renderEdges(tree) {
  const svg   = document.getElementById('edge-svg');
  const nodes = tree.nodes || [];
  const color = themeColor(tree.theme);
  const ahId  = themeArrow(tree.theme);

  // Drag redraws happen frequently; keep render idempotent by removing old edges.
  [...svg.children].forEach(c => { if (c.tagName !== 'defs') c.remove(); });

  nodes.forEach(nd => {
    const fp = S.pos[nd.id]; if (!fp) return;
    const fe = document.querySelector(`.dnode[data-id="${nd.id}"]`); if (!fe) return;
    const fh = fe.offsetHeight;

    (nd.options||[]).forEach(o => {
      if (!o.next) return;
      const tp = S.pos[o.next]; if (!tp) return;
      const te = document.querySelector(`.dnode[data-id="${o.next}"]`);
      const th2 = te ? te.offsetHeight : 80;

      const x1 = fp.x + NODE_W,  y1 = fp.y + fh/2;
      const x2 = tp.x,           y2 = tp.y + th2/2;
      const dx = Math.abs(x2-x1);
      const cp = Math.max(dx*0.45, 60);

      const d = `M${x1} ${y1} C${x1+cp} ${y1},${x2-cp} ${y2},${x2} ${y2}`;
      const path = makeSVG('path');
      path.setAttribute('d', d);
      path.setAttribute('stroke', color);
      path.setAttribute('stroke-width', '1.5');
      path.setAttribute('fill', 'none');
      path.setAttribute('marker-end', `url(#${ahId})`);
      path.setAttribute('opacity', '.65');
      svg.appendChild(path);

      // Edge label
      const mx = (x1+x2)/2, my = Math.min(y1,y2) + Math.abs(y2-y1)/2 - 10;
      const lbl = S.lang[o.text] ? trunc(S.lang[o.text],22) : trunc(o.text.split('.').pop(),22);
      const txt = makeSVG('text');
      txt.setAttribute('x', mx); txt.setAttribute('y', my);
      txt.setAttribute('fill', color); txt.setAttribute('font-size','9');
      txt.setAttribute('text-anchor','middle'); txt.setAttribute('opacity','.8');
      txt.setAttribute('font-family','Consolas,monospace');
      txt.textContent = lbl;
      svg.appendChild(txt);
    });
  });
}

function makeSVG(tag) {
  return document.createElementNS('http://www.w3.org/2000/svg', tag);
}

// ── Drag ───────────────────────────────────────────────────────────────────
let wasDragging = false, isDragging = false, dragId = null, dragOX = 0, dragOY = 0, dragEl = null;
let edgeFramePending = false;

function scheduleEdgeRedraw() {
  if (edgeFramePending) return;
  edgeFramePending = true;
  requestAnimationFrame(() => {
    edgeFramePending = false;
    if (S.tidx >= 0 && S.data) renderEdges(S.data.trees[S.tidx]);
  });
}

function startDrag(e, id, pos) {
  isDragging = true; wasDragging = false; dragId = id;
  dragEl = document.querySelector(`.dnode[data-id="${id}"]`);
  const r = dragEl.getBoundingClientRect();
  dragOX = e.clientX - r.left; dragOY = e.clientY - r.top;
  e.preventDefault();
}

document.addEventListener('mousemove', e => {
  if (!isDragging || !dragEl) return;
  wasDragging = true;
  const co = document.getElementById('canvas-outer');
  const cr = co.getBoundingClientRect();
  const x = Math.max(0, e.clientX - cr.left + co.scrollLeft - dragOX);
  const y = Math.max(0, e.clientY - cr.top  + co.scrollTop  - dragOY);
  S.pos[dragId] = {x, y};
  dragEl.style.left = x + 'px'; dragEl.style.top = y + 'px';
  scheduleEdgeRedraw();
});

document.addEventListener('mouseup', () => {
  isDragging = false;
  dragEl = null;
  edgeFramePending = false;
});

// ── Node selection ──────────────────────────────────────────────────────────
function selectNode(id) {
  S.sel = id;
  document.querySelectorAll('.dnode').forEach(e => e.classList.toggle('selected', e.dataset.id===id));
  renderEditor();
}

// ── Editor panel ────────────────────────────────────────────────────────────
function renderEditor() {
  const idle    = document.getElementById('ep-idle');
  const content = document.getElementById('ep-content');

  if (!S.sel || S.tidx < 0) {
    idle.style.display=''; content.style.display='none'; return;
  }
  const tree = S.data.trees[S.tidx];
  const nd   = tree.nodes.find(n=>n.id===S.sel);
  if (!nd) { idle.style.display=''; content.style.display='none'; return; }

  idle.style.display='none'; content.style.display='block';

  const otherIds = tree.nodes.map(n=>n.id).filter(id=>id!==nd.id);
  const nodeOpts = '<option value="">— end conversation —</option>' +
    otherIds.map(id=>`<option value="${id}">${id}</option>`).join('');

  content.innerHTML = `
  <div class="es">
    <div class="el">Node ID</div>
    <input class="ei mono" id="ed-id" value="${esc(nd.id)}" placeholder="node_id">
  </div>
  <hr class="sep">
  <div class="es">
    <div class="el">Lines (translation keys)<button class="bs add" id="btn-addline">＋</button></div>
    <div id="ed-lines">${renderLines(nd)}</div>
  </div>
  <hr class="sep">
  <div class="es">
    <div class="el">Options<button class="bs add" id="btn-addopt">＋</button></div>
    <div id="ed-opts">${renderOptions(nd, nodeOpts)}</div>
  </div>
  <hr class="sep">
  <button class="bs red full" id="btn-delnode">🗑 Delete node</button>`;

  // Wire ID change
  document.getElementById('ed-id').addEventListener('change', e => changeNodeId(e.target.value));

  // Wire add line / option
  document.getElementById('btn-addline').onclick = addLine;
  document.getElementById('btn-addopt').onclick  = addOption;

  // Wire line inputs
  nd.lines.forEach((_, i) => {
    const inp = document.getElementById(`li-${i}`);
    if (inp) inp.addEventListener('change', e => { nd.lines[i] = e.target.value; markDirty(); });
    const del = document.getElementById(`ld-${i}`);
    if (del) del.onclick = () => { nd.lines.splice(i,1); refreshEditor(); markDirty(); };
  });

  // Wire option inputs
  (nd.options||[]).forEach((o, i) => {
    const el = id => document.getElementById(id);
    el(`ot-${i}`)?.addEventListener('change', e => { o.text  = e.target.value; refreshEdges(); markDirty(); });
    el(`on-${i}`)?.addEventListener('change', e => { o.next  = e.target.value || null; refreshEdges(); markDirty(); });
    el(`oe-${i}`)?.addEventListener('change', e => { o.event = e.target.value || null; markDirty(); });
    const delBtn = el(`od-${i}`);
    if (delBtn) delBtn.onclick = () => { nd.options.splice(i,1); refreshEditor(); markDirty(); };
  });

  document.getElementById('btn-delnode').onclick = deleteNode;
}

function renderLines(nd) {
  return (nd.lines||[]).map((key,i) => {
    const tx = S.lang[key];
    return `<div class="eitem">
      <div class="erow">
        <input class="ei mono" id="li-${i}" value="${esc(key)}" placeholder="translation.key">
        <button class="bs red" id="ld-${i}">✕</button>
      </div>
      ${tx ? `<div class="trans">"${trunc(tx,48)}"</div>` : ''}
    </div>`;
  }).join('');
}

function renderOptions(nd, nodeOpts) {
  return (nd.options||[]).map((o,i) => {
    const tx = S.lang[o.text];
    const selOpts = nodeOpts.replace(`value="${o.next||''}"`, `value="${o.next||''}" selected`);
    return `<div class="eitem">
      <div style="display:flex;justify-content:space-between;margin-bottom:4px">
        <span style="font-size:10px;color:#7a4040">Option ${i+1}</span>
        <button class="bs red" id="od-${i}" style="padding:1px 6px">✕</button>
      </div>
      <div class="esub">Text key</div>
      <input class="ei mono" id="ot-${i}" value="${esc(o.text)}" placeholder="hemomancy.dialogue..." style="margin-bottom:3px">
      ${tx ? `<div class="trans">"${trunc(tx,46)}"</div>` : ''}
      <div class="esub">Goes to node</div>
      <select class="ei" id="on-${i}" style="margin-bottom:3px">${selOpts}</select>
      <div class="esub">Event ID (optional)</div>
      <input class="ei mono" id="oe-${i}" value="${esc(o.event||'')}" placeholder="event_id">
    </div>`;
  }).join('');
}

// ── Edit actions ────────────────────────────────────────────────────────────
function curNode() {
  const tree = S.data.trees[S.tidx];
  return tree.nodes.find(n=>n.id===S.sel);
}

function changeNodeId(newId) {
  newId = newId.trim();
  if (!newId || newId === S.sel) return;
  const tree = S.data.trees[S.tidx];
  const oldId = S.sel;
  tree.nodes.forEach(n => {
    (n.options||[]).forEach(o => { if(o.next===oldId) o.next=newId; });
  });
  if (tree.start_node === oldId) tree.start_node = newId;
  const nd = curNode(); nd.id = newId;
  S.pos[newId] = S.pos[oldId]; delete S.pos[oldId];
  S.sel = newId;
  markDirty();
  renderGraph();
  requestAnimationFrame(() => selectNode(newId));
}

function addLine() {
  const nd = curNode();
  nd.lines = nd.lines || [];
  nd.lines.push('hemomancy.new.line');
  markDirty(); refreshEditor();
}

function addOption() {
  const nd = curNode();
  nd.options = nd.options || [];
  nd.options.push({text:'hemomancy.dialogue.option.leave', next:null, event:null});
  markDirty(); refreshEditor();
}

function deleteNode() {
  const nd = curNode();
  if (!confirm(`Delete node "${nd.id}"?\nAll options pointing to it will be removed.`)) return;
  const tree = S.data.trees[S.tidx];
  const id = S.sel;
  tree.nodes.forEach(n => { n.options = (n.options||[]).filter(o=>o.next!==id); });
  tree.nodes = tree.nodes.filter(n=>n.id!==id);
  if (tree.start_node===id && tree.nodes.length) tree.start_node = tree.nodes[0].id;
  delete S.pos[id];
  S.sel = null;
  markDirty(); computeLayout(); renderGraph(); renderEditor();
}

function addNewNode() {
  if (S.tidx < 0 || !S.data) { alert('Select a tree first.'); return; }
  const tree = S.data.trees[S.tidx];
  const newId = 'new_node_' + Date.now();
  tree.nodes.push({id:newId, lines:['hemomancy.new.line'],
    options:[{text:'hemomancy.dialogue.option.leave', next:null, event:null}]});
  const maxY = Object.values(S.pos).reduce((m,p)=>Math.max(m,p.y),0);
  S.pos[newId] = {x: MARGIN, y: maxY + 160};
  markDirty(); renderGraph();
  requestAnimationFrame(() => selectNode(newId));
}

function refreshEditor() {
  renderGraph();
  requestAnimationFrame(() => { selectNode(S.sel); });
}

function refreshEdges() {
  scheduleEdgeRedraw();
}

// ── Export ──────────────────────────────────────────────────────────────────
function exportJSON() {
  if (!S.data) { alert('Nothing to export.'); return; }
  const json = JSON.stringify(S.data, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (S.data.source_file||'dialogue_trees').replace('.java','.json');
  a.click();
}

// ── Dirty tracking ──────────────────────────────────────────────────────────
function markDirty() {
  S.dirty = true;
  document.getElementById('btnExport').textContent = '💾 Export JSON*';
}

// ── Utilities ───────────────────────────────────────────────────────────────
function trunc(s, n) { return s && s.length>n ? s.slice(0,n-1)+'…' : (s||''); }
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

attemptAutoLoadLang();
</script>
</body>
</html>
