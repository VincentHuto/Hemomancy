<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hemomancy Recipe Editor — Blood Structures &amp; Cardinal Rites</title>
<style>
/* ── Reset & Base ─────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1a1015;--bg2:#241a20;--bg3:#2e222a;--bg4:#3a2c35;
  --fg:#e8d5d0;--fg2:#c4a8a0;--accent:#c83232;--accent2:#e05050;
  --gold:#d4a840;--green:#40a860;--blue:#4080d0;
  --border:#5a3a48;--cell:36px;
}
html{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--fg);font-size:14px}
body{display:flex;flex-direction:column;min-height:100vh}
button{cursor:pointer;font:inherit;border:none;border-radius:4px;padding:6px 14px;transition:.15s}
input,select,textarea{font:inherit;border-radius:4px;border:1px solid var(--border);background:var(--bg2);color:var(--fg);padding:4px 8px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:var(--accent)}

/* ── Layout ───────────────────────────────────────────────── */
header{background:var(--bg2);border-bottom:2px solid var(--accent);padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:1.2rem;color:var(--accent2);white-space:nowrap}
header h1 span{color:var(--gold)}

.mode-tabs{display:flex;gap:4px}
.mode-tabs button{background:var(--bg3);color:var(--fg2);padding:6px 16px;border:1px solid var(--border)}
.mode-tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.toolbar{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.toolbar button{background:var(--bg3);color:var(--fg);border:1px solid var(--border)}
.toolbar button:hover{background:var(--bg4);border-color:var(--accent)}
.toolbar button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.toolbar button.primary:hover{background:var(--accent2)}

main{display:flex;flex:1;overflow:hidden}

/* ── Sidebar ──────────────────────────────────────────────── */
.sidebar{width:300px;min-width:260px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.sidebar section{padding:12px;border-bottom:1px solid var(--border)}
.sidebar h3{font-size:.85rem;color:var(--gold);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.field{margin-bottom:8px}
.field label{display:block;font-size:.8rem;color:var(--fg2);margin-bottom:2px}
.field input,.field select,.field textarea{width:100%}
.field textarea{resize:vertical;min-height:60px}

/* ── Palette ──────────────────────────────────────────────── */
.palette-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(28px,1fr));gap:3px}
.palette-cell{width:28px;height:28px;border-radius:4px;border:2px solid transparent;cursor:pointer;position:relative;transition:.1s}
.palette-cell:hover{border-color:var(--fg2);transform:scale(1.15)}
.palette-cell.selected{border-color:var(--gold);box-shadow:0 0 6px var(--gold)}
.palette-cell[title]::after{content:attr(data-key);position:absolute;bottom:-1px;right:1px;font-size:8px;color:#fff;text-shadow:0 0 2px #000;font-weight:bold}

/* ── Key Map Editor ───────────────────────────────────────── */
.key-map{display:flex;flex-direction:column;gap:4px}
.key-row{display:flex;align-items:center;gap:6px}
.key-char{width:24px;height:24px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:.85rem;color:#fff;flex-shrink:0}
.key-row select{flex:1}
.key-row .remove-key{background:none;color:var(--accent);padding:2px 6px;font-size:1rem}
.add-key-btn{background:var(--bg3);color:var(--green);border:1px dashed var(--green);margin-top:4px;font-size:.8rem}
.add-key-btn:hover{background:var(--bg4)}

/* ── Grid Editor ──────────────────────────────────────────── */
.editor-area{flex:1;display:flex;flex-direction:column;overflow:auto;padding:16px}
.layer-nav{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.layer-nav button{background:var(--bg3);color:var(--fg);border:1px solid var(--border);padding:4px 12px}
.layer-nav button:hover{background:var(--bg4)}
.layer-nav button.active-layer{background:var(--accent);color:#fff;border-color:var(--accent)}
.layer-nav .layer-label{color:var(--gold);font-weight:bold;font-size:.9rem}
.dimension-controls{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
.dimension-controls label{font-size:.8rem;color:var(--fg2)}
.dimension-controls input{width:50px;text-align:center}

.grid-container{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;overflow:auto;padding:10px}
.grid-wrapper{position:relative;display:inline-block}
.grid-row{display:flex;gap:0}

.grid-cell{
  width:var(--cell);height:var(--cell);
  border:1px solid var(--border);
  cursor:pointer;transition:.08s;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:bold;color:#fff;text-shadow:0 0 2px #000;
  user-select:none;
}
.grid-cell:hover{outline:2px solid var(--gold);z-index:1}
.grid-cell.air{background:var(--bg)}

/* Axis labels */
.axis-label{font-size:.7rem;color:var(--fg2);text-align:center}
.axis-top{display:flex;gap:0;margin-bottom:2px}
.axis-top .axis-label{width:var(--cell)}
.axis-left{display:flex;flex-direction:column;gap:0;margin-right:2px}
.axis-left .axis-label{height:var(--cell);display:flex;align-items:center;justify-content:center;width:18px}

/* ── 3D Preview ───────────────────────────────────────────── */
.preview-section{margin-top:12px;border-top:1px solid var(--border);padding-top:10px}
.preview-3d{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:8px}
.preview-layer{opacity:.6;transition:.2s}
.preview-layer:hover,.preview-layer.active{opacity:1}
.preview-layer-label{text-align:center;font-size:.7rem;color:var(--fg2);margin-bottom:2px}
.mini-grid{display:flex;flex-direction:column}
.mini-row{display:flex}
.mini-cell{width:8px;height:8px}
.mini-cell.air{background:transparent}

/* ── JSON Panel ───────────────────────────────────────────── */
.json-panel{display:none;flex:1;flex-direction:column;padding:16px;overflow:auto}
.json-panel.visible{display:flex}
.json-panel textarea{flex:1;font-family:'Cascadia Code','Fira Code',monospace;font-size:.85rem;background:var(--bg);border:1px solid var(--border);color:var(--fg);padding:12px;resize:none;min-height:400px}
.json-panel .json-actions{display:flex;gap:8px;margin-top:8px}

/* ── Toast ────────────────────────────────────────────────── */
.toast{position:fixed;bottom:20px;right:20px;background:var(--green);color:#fff;padding:10px 20px;border-radius:6px;font-weight:bold;opacity:0;transition:.3s;pointer-events:none;z-index:999}
.toast.error{background:var(--accent)}
.toast.show{opacity:1}

/* ── Validation ───────────────────────────────────────────── */
.validation-msg{font-size:.8rem;padding:6px 8px;border-radius:4px;margin-top:4px}
.validation-msg.warn{background:#3a2c10;color:var(--gold);border:1px solid var(--gold)}
.validation-msg.error{background:#3a1010;color:var(--accent2);border:1px solid var(--accent)}
.validation-msg.ok{background:#103a10;color:var(--green);border:1px solid var(--green)}

/* ── Responsive ───────────────────────────────────────────── */
@media(max-width:800px){
  main{flex-direction:column}
  .sidebar{width:100%;max-height:40vh;border-right:none;border-bottom:1px solid var(--border)}
}
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════ -->
<!-- HEADER                                                     -->
<!-- ═══════════════════════════════════════════════════════════ -->
<header>
  <h1>🩸 <span>Hemomancy</span> Recipe Editor</h1>
  <div class="mode-tabs">
    <button class="active" data-mode="structure" onclick="setMode('structure')">Blood Structure</button>
    <button data-mode="rite" onclick="setMode('rite')">Cardinal Rite</button>
  </div>
  <div class="toolbar">
    <button onclick="newRecipe()">✦ New</button>
    <button onclick="document.getElementById('fileInput').click()">📂 Load JSON</button>
    <button onclick="toggleJsonPanel()">{ } JSON</button>
    <button class="primary" onclick="downloadJson()">⬇ Export</button>
  </div>
  <input type="file" id="fileInput" accept=".json" style="display:none" onchange="loadFile(event)">
</header>

<main>
<!-- ═══════════════════════════════════════════════════════════ -->
<!-- SIDEBAR                                                    -->
<!-- ═══════════════════════════════════════════════════════════ -->
<div class="sidebar">
  <!-- Recipe Properties -->
  <section>
    <h3>Recipe Properties</h3>
    <div class="field">
      <label>Recipe File Name</label>
      <input type="text" id="recipeName" placeholder="my_recipe" oninput="markDirty()">
    </div>
    <div class="field">
      <label>Blood Cost</label>
      <input type="number" id="bloodCost" value="100" min="0" step="25" oninput="markDirty()">
    </div>
    <!-- Structure-only fields -->
    <div class="field structure-field">
      <label>Held Item</label>
      <input type="text" id="heldItem" list="itemList" placeholder="hemomancy:sanguine_formation" oninput="markDirty()">
    </div>
    <div class="field structure-field">
      <label>Hit Block</label>
      <input type="text" id="hitBlock" list="blockList" placeholder="hemomancy:venous_stone" oninput="markDirty()">
    </div>
    <!-- Rite-only fields -->
    <div class="field rite-field" style="display:none">
      <label>Rite Type</label>
      <select id="riteType" onchange="onRiteTypeChange()">
        <option value="minor">Minor (3×3)</option>
        <option value="lesser" selected>Lesser (5×5)</option>
        <option value="greater">Greater (7×7)</option>
        <option value="grand">Grand (9×9)</option>
      </select>
    </div>
    <div class="field rite-field" style="display:none">
      <label>Rite Name</label>
      <input type="text" id="riteName" placeholder="Rite of the Crimson..." oninput="markDirty()">
    </div>
    <div class="field rite-field" style="display:none">
      <label>Rite Description</label>
      <textarea id="riteDescription" placeholder="A powerful rite that..." oninput="markDirty()"></textarea>
    </div>
    <div class="field rite-field" style="display:none">
      <label>Required Degree Override (-1 = default)</label>
      <input type="number" id="requiredDegree" value="-1" min="-1" max="10" oninput="markDirty()">
    </div>
    <div class="field">
      <label>Result Item</label>
      <input type="text" id="resultItem" list="itemList" placeholder="hemomancy:morphling_incubator" oninput="markDirty()">
    </div>
    <div id="validationArea"></div>
  </section>

  <!-- Block Key Map -->
  <section>
    <h3>Block Key Map</h3>
    <div id="keyMap" class="key-map"></div>
    <button class="add-key-btn" onclick="addKeyEntry()">+ Add Block Mapping</button>
  </section>

  <!-- Palette -->
  <section>
    <h3>Paint Palette</h3>
    <p style="font-size:.75rem;color:var(--fg2);margin-bottom:6px">Click = paint • Right-click / Space = erase • Middle-click = pick<br>Press A-Z to select palette key • [ ] to navigate layers</p>
    <div id="palette" class="palette-grid"></div>
    <div style="margin-top:6px;display:flex;align-items:center;gap:6px">
      <div class="palette-cell selected" style="background:var(--bg);border-color:var(--fg2);width:24px;height:24px" onclick="selectPaletteKey(' ')" id="eraserBtn" title="Air / Eraser"></div>
      <span style="font-size:.8rem;color:var(--fg2)">Air / Eraser (or right-click)</span>
    </div>
  </section>

  <!-- 3D Overview -->
  <section>
    <h3>All Layers Overview</h3>
    <div id="preview3d" class="preview-3d"></div>
  </section>
</div>

<!-- ═══════════════════════════════════════════════════════════ -->
<!-- EDITOR AREA                                                -->
<!-- ═══════════════════════════════════════════════════════════ -->
<div class="editor-area" id="editorArea">
  <div class="layer-nav">
    <span class="layer-label">Layer:</span>
    <div id="layerButtons"></div>
    <button onclick="addLayer()" title="Add layer above current">+ Layer</button>
    <button onclick="removeLayer()" title="Remove current layer">− Layer</button>
    <div class="dimension-controls">
      <label>Width (X):</label>
      <input type="number" id="dimWidth" value="3" min="1" max="15" onchange="resizeGrid()">
      <label>Depth (Z):</label>
      <input type="number" id="dimDepth" value="3" min="1" max="15" onchange="resizeGrid()">
    </div>
  </div>
  <div class="grid-container" id="gridContainer"></div>
</div>

<!-- ═══════════════════════════════════════════════════════════ -->
<!-- JSON PANEL                                                 -->
<!-- ═══════════════════════════════════════════════════════════ -->
<div class="json-panel" id="jsonPanel">
  <textarea id="jsonTextarea" spellcheck="false"></textarea>
  <div class="json-actions">
    <button class="primary" onclick="applyJson()">Apply JSON → Editor</button>
    <button onclick="refreshJson()">Refresh from Editor</button>
    <button onclick="copyJson()">📋 Copy</button>
  </div>
</div>
</main>

<!-- Datalists for autocomplete -->
<datalist id="blockList"></datalist>
<datalist id="itemList"></datalist>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- ═══════════════════════════════════════════════════════════ -->
<!-- JAVASCRIPT                                                 -->
<!-- ═══════════════════════════════════════════════════════════ -->
<script>
// ── Data ──────────────────────────────────────────────────────
const KNOWN_BLOCKS = [
  "hemomancy:hematic_iron_block","hemomancy:hematic_iron_pillar","hemomancy:chiseled_hematic_iron_block",
  "hemomancy:hemolytic_plating_block","hemomancy:venous_stone","hemomancy:gilded_venous_stone",
  "hemomancy:polished_venous_stone","hemomancy:polished_venous_stone_bricks","hemomancy:chiseled_polished_venous_stone",
  "hemomancy:infested_venous_stone","hemomancy:engram_block","hemomancy:sanguine_glass","hemomancy:sanguine_pane",
  "hemomancy:vivianite_glass","hemomancy:vivianite_pane","hemomancy:befouling_ash_trail",
  "hemomancy:smouldering_ash_trail","hemomancy:active_befouling_ash_trail","hemomancy:active_smouldering_ash_trail",
  "hemomancy:conscious_mass","hemomancy:unstained_podium",
  "hemomancy:dendritic_distributor","hemomancy:juiceinator","hemomancy:morphling_incubator",
  "hemomancy:somatic_loom","hemomancy:runic_chisel_station","hemomancy:vial_centrifuge",
  "hemomancy:visceral_mirror","hemomancy:mnemonic_reliquary","hemomancy:unstained_pillar",
  "minecraft:air","minecraft:stone","minecraft:cobblestone","minecraft:obsidian",
  "minecraft:gold_block","minecraft:iron_block","minecraft:diamond_block",
  "minecraft:redstone_block","minecraft:lapis_block","minecraft:glowstone",
  "minecraft:soul_sand","minecraft:netherrack","minecraft:crying_obsidian"
];

const KNOWN_ITEMS = [
  "hemomancy:sanguine_formation","hemomancy:sanguine_quintessence","hemomancy:dried_gourd",
  "hemomancy:living_staff","hemomancy:liber_sanguinum","hemomancy:curved_horn",
  "hemomancy:morphling_polyp","hemomancy:befouling_ash","hemomancy:smouldering_ash",
  "hemomancy:hematic_iron_scrap","hemomancy:blood_crystal_shard","hemomancy:cleansed_blood_crystal_shard",
  "hemomancy:vivianite_cluster","hemomancy:foul_paste","hemomancy:gourd_seeds",
  "hemomancy:living_blade","hemomancy:living_axe","hemomancy:living_spear","hemomancy:living_crossbow",
  "hemomancy:hematic_iron_sword","hemomancy:hematic_iron_helm","hemomancy:hematic_iron_chestplate",
  "hemomancy:hematic_iron_leggings","hemomancy:hematic_iron_boots",
  "hemomancy:semi_sentient_construct","hemomancy:dendritic_distributor","hemomancy:juiceinator",
  "hemomancy:morphling_incubator","hemomancy:somatic_loom","hemomancy:runic_chisel_station",
  "hemomancy:vial_centrifuge","hemomancy:visceral_mirror","hemomancy:mnemonic_reliquary",
  "hemomancy:blood_gourd_red","hemomancy:blood_gourd_black","hemomancy:blood_gourd_white",
  "hemomancy:gourd","hemomancy:unsigned_ancestral_ledger","hemomancy:unstained_pillar"
];

// Color palette for block keys
const KEY_COLORS = [
  "#c83232","#3264c8","#32a850","#d4a840","#a040c8","#40b8c8",
  "#c87832","#50c850","#c84080","#6060e0","#e08040","#40c8a0",
  "#b040b0","#80c040","#c84040","#4080a0","#e0a060","#60a0c0",
  "#a06040","#40a0a0","#c06080","#8080c0","#a0a040","#c08080"
];

// ── State ─────────────────────────────────────────────────────
let mode = "structure"; // "structure" or "rite"
let layers = [];        // layers[layerIdx][z][x] = char (' ' for air)
let currentLayer = 0;
let keyMap = {};        // char -> { block: "mod:block", color: "#hex" }
let selectedKey = " ";  // currently selected paint key
let nextKeyChar = "A";
let isDirty = false;
let isPainting = false;
let paintButton = 0;
let jsonPanelVisible = false;

// ── Init ──────────────────────────────────────────────────────
(function init() {
  populateDatalist("blockList", KNOWN_BLOCKS);
  populateDatalist("itemList", KNOWN_ITEMS);
  newRecipe();
})();

function populateDatalist(id, items) {
  const dl = document.getElementById(id);
  dl.innerHTML = items.map(i => `<option value="${i}">`).join("");
}

// ── Mode Switching ────────────────────────────────────────────
function setMode(m) {
  mode = m;
  document.querySelectorAll(".mode-tabs button").forEach(b =>
    b.classList.toggle("active", b.dataset.mode === m));
  document.querySelectorAll(".structure-field").forEach(el =>
    el.style.display = m === "structure" ? "" : "none");
  document.querySelectorAll(".rite-field").forEach(el =>
    el.style.display = m === "rite" ? "" : "none");
  markDirty();
}

// ── New Recipe ────────────────────────────────────────────────
function newRecipe() {
  const isRite = mode === "rite";
  const size = isRite ? getRiteSize() : 3;
  const layerCount = isRite ? size : 3;

  document.getElementById("recipeName").value = "";
  document.getElementById("bloodCost").value = isRite ? 500 : 100;
  document.getElementById("heldItem").value = "hemomancy:sanguine_formation";
  document.getElementById("hitBlock").value = "hemomancy:venous_stone";
  document.getElementById("riteName").value = "";
  document.getElementById("riteDescription").value = "";
  document.getElementById("requiredDegree").value = -1;
  document.getElementById("resultItem").value = isRite ? "hemomancy:sanguine_formation" : "";

  document.getElementById("dimWidth").value = size;
  document.getElementById("dimDepth").value = size;

  keyMap = {};
  nextKeyChar = "A";
  selectedKey = " ";

  layers = [];
  for (let l = 0; l < layerCount; l++) {
    layers.push(createEmptyLayer(size, size));
  }
  currentLayer = 0;

  renderAll();
  isDirty = false;
}

function createEmptyLayer(width, depth) {
  const layer = [];
  for (let z = 0; z < depth; z++) {
    const row = [];
    for (let x = 0; x < width; x++) row.push(" ");
    layer.push(row);
  }
  return layer;
}

// ── Rite Helpers ──────────────────────────────────────────────
function getRiteSize() {
  const val = document.getElementById("riteType").value;
  return {minor:3,lesser:5,greater:7,grand:9}[val] || 5;
}

function onRiteTypeChange() {
  if (mode !== "rite") return;
  const size = getRiteSize();
  document.getElementById("dimWidth").value = size;
  document.getElementById("dimDepth").value = size;
  resizeGrid();
}

// ── Grid Dimensions ───────────────────────────────────────────
function resizeGrid() {
  const w = clamp(parseInt(document.getElementById("dimWidth").value) || 3, 1, 15);
  const d = clamp(parseInt(document.getElementById("dimDepth").value) || 3, 1, 15);
  document.getElementById("dimWidth").value = w;
  document.getElementById("dimDepth").value = d;

  for (let l = 0; l < layers.length; l++) {
    const old = layers[l];
    const nw = [];
    for (let z = 0; z < d; z++) {
      const row = [];
      for (let x = 0; x < w; x++) {
        row.push((old[z] && old[z][x]) ? old[z][x] : " ");
      }
      nw.push(row);
    }
    layers[l] = nw;
  }
  renderAll();
  markDirty();
}

// ── Layer Management ──────────────────────────────────────────
function addLayer() {
  const w = parseInt(document.getElementById("dimWidth").value) || 3;
  const d = parseInt(document.getElementById("dimDepth").value) || 3;
  layers.splice(currentLayer + 1, 0, createEmptyLayer(w, d));
  currentLayer++;
  renderAll();
  markDirty();
}

function removeLayer() {
  if (layers.length <= 1) { toast("Need at least one layer", true); return; }
  layers.splice(currentLayer, 1);
  if (currentLayer >= layers.length) currentLayer = layers.length - 1;
  renderAll();
  markDirty();
}

function selectLayer(idx) {
  currentLayer = idx;
  renderAll();
}

// ── Key Map Management ────────────────────────────────────────
function addKeyEntry(ch, block) {
  if (!ch) {
    ch = nextAvailableChar();
    if (!ch) { toast("Max " + KEY_COLORS.length + " block keys reached", true); return; }
  }
  const colorIdx = Object.keys(keyMap).length % KEY_COLORS.length;
  keyMap[ch] = { block: block || "", color: KEY_COLORS[colorIdx] };
  advanceNextChar();
  renderKeyMap();
  renderPalette();
  markDirty();
}

function removeKeyEntry(ch) {
  // Clear this char from all layers
  for (const layer of layers) {
    for (const row of layer) {
      for (let x = 0; x < row.length; x++) {
        if (row[x] === ch) row[x] = " ";
      }
    }
  }
  delete keyMap[ch];
  if (selectedKey === ch) selectedKey = " ";
  renderAll();
  markDirty();
}

function updateKeyBlock(ch, newBlock) {
  if (keyMap[ch]) keyMap[ch].block = newBlock;
  markDirty();
}

function nextAvailableChar() {
  for (let c = 65; c <= 90; c++) {
    const ch = String.fromCharCode(c);
    if (!keyMap[ch]) return ch;
  }
  return null;
}

function advanceNextChar() {
  nextKeyChar = nextAvailableChar() || "?";
}

// ── Palette Selection ─────────────────────────────────────────
function selectPaletteKey(ch) {
  selectedKey = ch;
  renderPalette();
}

// ── Rendering ─────────────────────────────────────────────────
function renderAll() {
  renderLayerButtons();
  renderGrid();
  renderKeyMap();
  renderPalette();
  renderPreview();
  validate();
}

function renderLayerButtons() {
  const container = document.getElementById("layerButtons");
  container.innerHTML = "";
  for (let i = 0; i < layers.length; i++) {
    const btn = document.createElement("button");
    btn.textContent = `Y${i}`;
    btn.className = i === currentLayer ? "active-layer" : "";
    btn.onclick = () => selectLayer(i);
    container.appendChild(btn);
  }
}

function renderGrid() {
  const container = document.getElementById("gridContainer");
  const layer = layers[currentLayer];
  if (!layer) return;
  const depth = layer.length;
  const width = layer[0].length;

  let html = '<div class="grid-wrapper">';

  // Top axis labels
  html += '<div style="display:flex"><div style="width:18px"></div><div class="axis-top">';
  for (let x = 0; x < width; x++) html += `<div class="axis-label">${x}</div>`;
  html += '</div></div>';

  html += '<div style="display:flex"><div class="axis-left">';
  for (let z = 0; z < depth; z++) html += `<div class="axis-label">${z}</div>`;
  html += '</div><div>';

  for (let z = 0; z < depth; z++) {
    html += '<div class="grid-row">';
    for (let x = 0; x < width; x++) {
      const ch = layer[z][x];
      const isAir = ch === " ";
      const km = keyMap[ch];
      const bg = isAir ? "var(--bg)" : (km ? km.color : "#555");
      html += `<div class="grid-cell${isAir ? ' air' : ''}" `
        + `style="background:${bg}" `
        + `data-x="${x}" data-z="${z}" `
        + `onmousedown="cellMouseDown(event,${x},${z})" `
        + `onmouseenter="cellMouseEnter(event,${x},${z})" `
        + `oncontextmenu="return false">`
        + `${isAir ? '' : ch}</div>`;
    }
    html += '</div>';
  }

  html += '</div></div></div>';
  container.innerHTML = html;
}

function renderKeyMap() {
  const container = document.getElementById("keyMap");
  let html = "";
  for (const [ch, data] of Object.entries(keyMap)) {
    html += `<div class="key-row">
      <div class="key-char" style="background:${data.color}">${ch}</div>
      <select onchange="updateKeyBlock('${ch}',this.value)">
        <option value="">-- select block --</option>
        ${KNOWN_BLOCKS.map(b => `<option value="${b}"${b===data.block?' selected':''}>${b.replace('hemomancy:','').replace('minecraft:','mc:')}</option>`).join('')}
        ${data.block && !KNOWN_BLOCKS.includes(data.block) ? `<option value="${data.block}" selected>${data.block}</option>` : ''}
      </select>
      <button class="remove-key" onclick="removeKeyEntry('${ch}')" title="Remove">✕</button>
    </div>`;
  }
  container.innerHTML = html || '<div style="font-size:.8rem;color:var(--fg2)">No block mappings yet. Click "+ Add Block Mapping" below.</div>';
}

function renderPalette() {
  const container = document.getElementById("palette");
  let html = "";
  for (const [ch, data] of Object.entries(keyMap)) {
    html += `<div class="palette-cell${selectedKey===ch?' selected':''}" `
      + `style="background:${data.color}" `
      + `data-key="${ch}" `
      + `title="${data.block || '(no block)'}" `
      + `onclick="selectPaletteKey('${ch}')"></div>`;
  }
  container.innerHTML = html;
  document.getElementById("eraserBtn").classList.toggle("selected", selectedKey === " ");
}

function renderPreview() {
  const container = document.getElementById("preview3d");
  let html = "";
  for (let l = 0; l < layers.length; l++) {
    const layer = layers[l];
    html += `<div class="preview-layer${l===currentLayer?' active':''}" onclick="selectLayer(${l})">`;
    html += `<div class="preview-layer-label">Y${l}</div>`;
    html += '<div class="mini-grid">';
    for (let z = 0; z < layer.length; z++) {
      html += '<div class="mini-row">';
      for (let x = 0; x < layer[z].length; x++) {
        const ch = layer[z][x];
        const isAir = ch === " ";
        const bg = isAir ? "transparent" : (keyMap[ch] ? keyMap[ch].color : "#555");
        html += `<div class="mini-cell${isAir?' air':''}" style="background:${bg}"></div>`;
      }
      html += '</div>';
    }
    html += '</div></div>';
  }
  container.innerHTML = html;
}

// ── Cell Interaction ──────────────────────────────────────────
function cellMouseDown(e, x, z) {
  e.preventDefault();
  isPainting = true;
  paintButton = e.button;
  paintCell(x, z, e.button, e);
  document.addEventListener("mouseup", stopPainting);
}

function cellMouseEnter(e, x, z) {
  if (!isPainting) return;
  paintCell(x, z, paintButton, e);
}

function stopPainting() {
  isPainting = false;
  document.removeEventListener("mouseup", stopPainting);
}

function paintCell(x, z, button, e) {
  const layer = layers[currentLayer];
  if (!layer || !layer[z]) return;

  if (button === 1) {
    // Middle click: pick block
    const ch = layer[z][x];
    if (ch !== " " && keyMap[ch]) {
      selectedKey = ch;
      renderPalette();
    }
    return;
  }

  const ch = button === 2 ? " " : selectedKey;
  if (layer[z][x] !== ch) {
    layer[z][x] = ch;
    renderGrid();
    renderPreview();
    markDirty();
  }
}

// ── JSON Generation ───────────────────────────────────────────
function generateJson() {
  const isRite = mode === "rite";

  // Build pattern: array of aisles, each aisle is an array of row strings
  // Aisles iterate X (width axis), rows iterate Z (depth axis) within layers (Y axis)
  // From existing JSON analysis: pattern[aisle_z][layer_y] = row_string[x]
  // Actually from the examples: pattern is [depth][layers] where each string has width chars
  // Let me re-examine: in the morphling_incubator pattern:
  // pattern has 3 entries (depth=3), each entry has 3 strings (layers=3), each string has 3 chars (width=3)
  // So pattern[z][y] = string of x-chars

  const depth = layers[0].length;
  const width = layers[0][0].length;
  const numLayers = layers.length;

  const pattern = [];
  for (let z = 0; z < depth; z++) {
    const aisle = [];
    for (let y = 0; y < numLayers; y++) {
      let row = "";
      for (let x = 0; x < width; x++) {
        row += layers[y][z][x];
      }
      aisle.push(row);
    }
    pattern.push(aisle);
  }

  // Build key map (only include keys that are actually used)
  const usedKeys = new Set();
  for (const layer of layers) {
    for (const row of layer) {
      for (const ch of row) {
        if (ch !== " ") usedKeys.add(ch);
      }
    }
  }

  const key = {};
  for (const ch of usedKeys) {
    if (keyMap[ch] && keyMap[ch].block) {
      key[ch] = { block: keyMap[ch].block };
    }
  }

  const obj = { type: isRite ? "hemomancy:cardinal_rite_recipe" : "hemomancy:blood_structure_recipe" };
  obj.bloodCost = parseFloat(document.getElementById("bloodCost").value) || 0;

  if (isRite) {
    obj.riteType = document.getElementById("riteType").value;
    obj.riteName = document.getElementById("riteName").value;
    obj.riteDescription = document.getElementById("riteDescription").value;
    const deg = parseInt(document.getElementById("requiredDegree").value);
    if (deg >= 0) obj.requiredDegree = deg;
  } else {
    obj.heldItem = document.getElementById("heldItem").value;
    obj.hitBlock = document.getElementById("hitBlock").value;
  }

  obj.pattern = pattern;
  obj.key = key;
  obj.result = { item: document.getElementById("resultItem").value };

  return obj;
}

function toJsonString(obj) {
  return JSON.stringify(obj, null, 2);
}

// ── JSON Import ───────────────────────────────────────────────
function loadFromJson(json) {
  let obj;
  try {
    obj = typeof json === "string" ? JSON.parse(json) : json;
  } catch (e) {
    toast("Invalid JSON: " + e.message, true);
    return;
  }

  // Detect mode
  if (obj.type === "hemomancy:cardinal_rite_recipe") {
    setMode("rite");
  } else if (obj.type === "hemomancy:blood_structure_recipe") {
    setMode("structure");
  }

  // Load properties
  document.getElementById("bloodCost").value = obj.bloodCost || 0;

  if (mode === "structure") {
    document.getElementById("heldItem").value = obj.heldItem || "";
    document.getElementById("hitBlock").value = obj.hitBlock || "";
  } else {
    document.getElementById("riteType").value = obj.riteType || "lesser";
    document.getElementById("riteName").value = obj.riteName || "";
    document.getElementById("riteDescription").value = obj.riteDescription || "";
    document.getElementById("requiredDegree").value = obj.requiredDegree != null ? obj.requiredDegree : -1;
  }

  document.getElementById("resultItem").value = (obj.result && obj.result.item) ? obj.result.item : "";

  // Parse key map
  keyMap = {};
  let colorIdx = 0;
  if (obj.key) {
    for (const [ch, val] of Object.entries(obj.key)) {
      keyMap[ch] = {
        block: val.block || "",
        color: KEY_COLORS[colorIdx % KEY_COLORS.length]
      };
      colorIdx++;
    }
  }
  advanceNextChar();

  // Parse pattern: pattern[z][y] = string of x-chars
  const pattern = obj.pattern;
  if (!pattern || !pattern.length) {
    toast("No pattern found in JSON", true);
    return;
  }

  const depth = pattern.length;
  const numLayers = pattern[0].length;
  const width = pattern[0][0].length;

  document.getElementById("dimWidth").value = width;
  document.getElementById("dimDepth").value = depth;

  layers = [];
  for (let y = 0; y < numLayers; y++) {
    const layer = [];
    for (let z = 0; z < depth; z++) {
      const row = [];
      const str = pattern[z][y] || "";
      for (let x = 0; x < width; x++) {
        row.push(x < str.length ? str[x] : " ");
      }
      layer.push(row);
    }
    layers.push(layer);
  }

  currentLayer = 0;
  renderAll();
  toast("Recipe loaded successfully!");
}

// ── File I/O ──────────────────────────────────────────────────
function loadFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const name = file.name.replace(/\.json$/, "");
  const reader = new FileReader();
  reader.onload = (e) => {
    loadFromJson(e.target.result);
    document.getElementById("recipeName").value = name;
  };
  reader.readAsText(file);
  event.target.value = "";
}

function downloadJson() {
  const obj = generateJson();
  const errs = getValidationErrors();
  if (errs.some(e => e.level === "error")) {
    if (!confirm("There are validation errors. Download anyway?")) return;
  }
  const str = toJsonString(obj);
  const name = (document.getElementById("recipeName").value || "recipe") + ".json";
  const blob = new Blob([str], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
  toast("Downloaded " + name);
}

function copyJson() {
  const str = document.getElementById("jsonTextarea").value;
  navigator.clipboard.writeText(str).then(
    () => toast("Copied to clipboard!"),
    (err) => toast("Copy failed — try selecting the text and using Ctrl+C", true)
  );
}

// ── JSON Panel ────────────────────────────────────────────────
function toggleJsonPanel() {
  jsonPanelVisible = !jsonPanelVisible;
  document.getElementById("jsonPanel").classList.toggle("visible", jsonPanelVisible);
  document.getElementById("editorArea").style.display = jsonPanelVisible ? "none" : "";
  if (jsonPanelVisible) refreshJson();
}

function refreshJson() {
  document.getElementById("jsonTextarea").value = toJsonString(generateJson());
}

function applyJson() {
  const str = document.getElementById("jsonTextarea").value;
  loadFromJson(str);
}

// ── Validation ────────────────────────────────────────────────
function getValidationErrors() {
  const errors = [];
  const isRite = mode === "rite";

  const cost = parseFloat(document.getElementById("bloodCost").value);
  if (!cost || cost <= 0) errors.push({ level: "error", msg: "Blood cost must be > 0" });

  if (!isRite) {
    if (!document.getElementById("heldItem").value) errors.push({ level: "error", msg: "Held item is required" });
    if (!document.getElementById("hitBlock").value) errors.push({ level: "error", msg: "Hit block is required" });
  } else {
    if (!document.getElementById("riteName").value) errors.push({ level: "warn", msg: "Rite name is empty" });
    if (!document.getElementById("riteDescription").value) errors.push({ level: "warn", msg: "Rite description is empty" });
  }

  if (!document.getElementById("resultItem").value) errors.push({ level: "error", msg: "Result item is required" });

  // Check used keys have block assignments
  const usedKeys = new Set();
  let hasAnyBlock = false;
  for (const layer of layers) {
    for (const row of layer) {
      for (const ch of row) {
        if (ch !== " ") { usedKeys.add(ch); hasAnyBlock = true; }
      }
    }
  }

  if (!hasAnyBlock) errors.push({ level: "warn", msg: "Pattern is empty (all air)" });

  for (const ch of usedKeys) {
    if (!keyMap[ch]) {
      errors.push({ level: "error", msg: `Key '${ch}' used in pattern but not in key map` });
    } else if (!keyMap[ch].block) {
      errors.push({ level: "error", msg: `Key '${ch}' has no block assigned` });
    }
  }

  // Check hit block is in pattern (for structures)
  if (!isRite) {
    const hitBlock = document.getElementById("hitBlock").value;
    if (hitBlock) {
      const patternBlocks = new Set();
      for (const ch of usedKeys) {
        if (keyMap[ch]) patternBlocks.add(keyMap[ch].block);
      }
      if (!patternBlocks.has(hitBlock)) {
        errors.push({ level: "warn", msg: "Hit block should appear in the pattern" });
      }
    }
  }

  // Degree info
  if (!isRite && cost > 0) {
    const tier = cost <= 100 ? "Basic (Degree 0)" : cost <= 200 ? "Advanced (Degree 2)" : "Expert (Degree 4)";
    errors.push({ level: "ok", msg: `Blood cost tier: ${tier}` });
  }
  if (isRite) {
    const riteType = document.getElementById("riteType").value;
    const defaultDeg = {minor:0,lesser:1,greater:3,grand:5}[riteType];
    const override = parseInt(document.getElementById("requiredDegree").value);
    const deg = override >= 0 ? override : defaultDeg;
    errors.push({ level: "ok", msg: `Required degree: ${deg}` });
  }

  if (errors.filter(e => e.level === "error").length === 0 && errors.filter(e => e.level === "warn").length === 0) {
    errors.push({ level: "ok", msg: "Recipe is valid ✓" });
  }

  return errors;
}

function validate() {
  const area = document.getElementById("validationArea");
  const errors = getValidationErrors();
  area.innerHTML = errors.map(e =>
    `<div class="validation-msg ${e.level}">${e.msg}</div>`
  ).join("");
}

// ── Utility ───────────────────────────────────────────────────
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

function markDirty() {
  isDirty = true;
  validate();
}

function toast(msg, isError) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show" + (isError ? " error" : "");
  setTimeout(() => el.className = "toast", 2500);
}

// ── Keyboard shortcuts ────────────────────────────────────────
document.addEventListener("keydown", (e) => {
  // Layer navigation with [ and ]
  if (e.key === "[" && currentLayer > 0) { selectLayer(currentLayer - 1); e.preventDefault(); }
  if (e.key === "]" && currentLayer < layers.length - 1) { selectLayer(currentLayer + 1); e.preventDefault(); }

  // Quick key selection with letter keys (when not in input)
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT") return;
  const upper = e.key.toUpperCase();
  if (/^[A-Z]$/.test(upper) && keyMap[upper]) {
    selectPaletteKey(upper);
    e.preventDefault();
  }
  if (e.key === " " || e.key === "Escape") {
    selectPaletteKey(" ");
    e.preventDefault();
  }
});
</script>
