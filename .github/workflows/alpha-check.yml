name: Alpha Check

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    # Hemomancy's git-ignored mod jars must be provisioned on the runner.
    runs-on: [self-hosted, windows, hemomancy-deps]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Preserve runner-provisioned, gitignored dependency jars in libs/.
          clean: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify dependency bundle
        shell: pwsh
        run: |
          $required = @(
            "libs/TerraBlender-neoforge-1.21.1-4.1.0.8.jar",
            "libs/buildinggadgets2-1.3.9.jar",
            "libs/worldedit-mod-7.3.8.jar",
            "libs/moonlight-neoforge-1.21.1-3.0.20.jar",
            "libs/dummmmmmy-1.21-2.0.12-neoforge.jar",
            "libs/theoneprobe-1.21_neo-12.0.8.jar",
            "libs/jei-1.21.1-neoforge-19.27.0.340.jar"
          )
          $missing = $required | Where-Object { -not (Test-Path -LiteralPath $_) }
          if ($missing) {
            throw "Runner is missing required local jars: $($missing -join ', ')"
          }

      - name: Run alpha release gate
        shell: pwsh
        run: .\gradlew.bat alphaCheck --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-check-reports
          path: |
            build/reports/tests/
            run/logs/latest.log
