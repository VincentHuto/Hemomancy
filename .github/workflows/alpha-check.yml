name: Alpha Check

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    # Hemomancy's git-ignored mod jars must be provisioned on the runner.
    runs-on: [self-hosted, windows, hemomancy-deps]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Preserve runner-provisioned, gitignored dependency jars in libs/.
          clean: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify pinned dependency inputs
        shell: pwsh
        run: pwsh -NoProfile -File gradle/verify-dependency-bundle.ps1

      - name: Run alpha release gate
        shell: pwsh
        run: .\gradlew.bat alphaCheck --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-check-reports
          path: |
            build/reports/tests/
            build/phlegethontic-gametest/logs/latest.log
            gradle/dependency-bundle.json
            run/logs/latest.log
