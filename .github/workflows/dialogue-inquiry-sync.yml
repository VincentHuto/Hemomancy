name: Dialogue Inquiry Canon Sync

on:
  push:
    branches: [fix/dialogue-inquiry-canon-sync]
  pull_request:
    branches: [neo-1.21.1]

permissions:
  contents: write

jobs:
  apply-migration:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dialogue-inquiry-canon-sync
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate migration script
        run: python -m py_compile tools/apply_dialogue_inquiry_sync.py

      - name: Apply approved migration
        run: python tools/apply_dialogue_inquiry_sync.py

      - name: Validate JSON resources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('src/main/resources').rglob('*.json'):
              try:
                  json.loads(path.read_text(encoding='utf-8'))
              except Exception as exc:
                  raise SystemExit(f'{path}: {exc}')
          print('JSON resources parse successfully.')
          PY

      - name: Commit migration output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main src/test docs/DIALOGUE_ITEM_QUERY_GUIDE.md
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
          else
            git commit -m "fix(dialogue): synchronize inquiry canon and runtime"
            git push origin HEAD:fix/dialogue-inquiry-canon-sync
          fi
