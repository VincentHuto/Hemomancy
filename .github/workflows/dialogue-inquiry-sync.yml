name: Dialogue Inquiry Canon Sync

on:
  push:
    branches: [fix/dialogue-inquiry-canon-sync]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, windows, hemomancy-deps]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dialogue-inquiry-canon-sync
          clean: false
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply approved migration
        shell: pwsh
        run: python tools/apply_dialogue_inquiry_sync.py

      - name: Run focused inquiry tests
        shell: pwsh
        run: .\gradlew.bat test --tests "*ItemInquiry*" --tests "*DialogueInquiry*" --tests "*AlchemistDialogueScopeTest" --tests "*PuppeteeringThreadInquiryOwnershipTest" --console=plain

      - name: Run full JVM suite
        shell: pwsh
        run: .\gradlew.bat test --console=plain

      - name: Commit verified correction
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main src/test docs/DIALOGUE_ITEM_QUERY_GUIDE.md
          if (git diff --cached --quiet) {
            Write-Host "No migration changes to commit."
          } else {
            git commit -m "fix(dialogue): synchronize inquiry canon and runtime"
            git push origin HEAD:fix/dialogue-inquiry-canon-sync
          }
