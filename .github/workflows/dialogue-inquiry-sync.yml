name: Dialogue Inquiry Canon Sync

on:
  push:
    branches: [fix/dialogue-inquiry-canon-sync]
  pull_request:
    branches: [neo-1.21.1]

permissions:
  contents: read

jobs:
  verify-inquiries:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out Hemomancy
        uses: actions/checkout@v4
        with:
          ref: fix/dialogue-inquiry-canon-sync
          path: Hemomancy
          fetch-depth: 0
          lfs: true

      - name: Check out HutosLib composite build
        uses: actions/checkout@v4
        with:
          repository: VincentHuto/HutosLib
          ref: neo-1.21.1
          path: HutosLib
          lfs: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate inquiry JSON and runtime language
        working-directory: Hemomancy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [Path('src/main/resources/assets/hemomancy/lang/en_us.json')]
          paths.extend(Path('src/main/resources/data/hemomancy/dialogue_inquiry').rglob('*.json'))
          for path in paths:
              json.loads(path.read_text(encoding='utf-8-sig'))
          print(f'Validated {len(paths)} inquiry/runtime-language JSON resources.')
          PY

      - name: Run focused inquiry tests
        working-directory: Hemomancy
        run: ./gradlew test --tests "*ItemInquiry*" --tests "*DialogueInquiry*" --tests "*AlchemistDialogueScopeTest" --tests "*PuppeteeringThreadInquiryOwnershipTest" --console=plain

      - name: Run full JVM suite
        working-directory: Hemomancy
        run: ./gradlew test --console=plain
