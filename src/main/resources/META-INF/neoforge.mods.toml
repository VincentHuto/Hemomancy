modLoader="javafml" #mandatory

# NeoForge loader 4+ covers all NeoForge 21.x releases
loaderVersion="${loader_version_range}" #mandatory

license="${mod_license}"

[[mods]] #mandatory

modId="${mod_id}" #mandatory

version="${mod_version}" #mandatory

displayName="Hemomancy; Sanguine Mastery" #mandatory

logoFile="logo.png" #optional

credits='''
Thanks to these folks, who I looked to for help:
Vazkii, WolfShotz, Direwolf20, baileyholl, and many others.
And to the entire NeoForge and Forge Discords.
'''

authors="${mod_authors}" #optional

description='''
Hemomancy is a NeoForge blood-magic mod about sacred inheritance, visceral craft,
and the fungal blood-memory beneath the Hematic Order.

This alpha focuses on the playable Harbinger and Unstained progression loops,
with later boss, compat, and world-placement systems still being hardened.
'''

# Dependencies
# NeoForge format uses type="required" / type="optional" instead of mandatory=

[[dependencies.hemomancy]]
    modId="neoforge"
    type="required"
    versionRange="${neoforge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.hemomancy]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.hemomancy]]
    modId="hutoslib"
    type="required"
    versionRange="[1,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.hemomancy]]
    modId="jei"
    type="optional"
    versionRange="[8,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.hemomancy]]
    modId="terrablender"
    type="required"
    versionRange="[4.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.hemomancy]]
    modId="geckolib"
    type="required"
    versionRange="[4.2,)"
    ordering="NONE"
    side="BOTH"

