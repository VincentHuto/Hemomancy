// ============================================================
//  Hemomancy – NeoForge 1.21.1 build script
//  Migrated from ForgeGradle/Forge 1.20.1 → NeoGradle/NeoForge 1.21.1
// ============================================================
plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id "org.jetbrains.gradle.plugin.idea-ext" version "1.1.7"
    // NeoGradle replaces ForgeGradle (7.1.25 from official MDK for 1.21.1)
    id 'net.neoforged.gradle.userdev' version '7.0.165'
    // NOTE: org.spongepowered.mixin Gradle plugin is NOT used with NeoGradle 7 –
    // NeoGradle handles mixin refmap generation automatically via jvmArguments below.
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// MC 1.21.1 requires Java 21
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

// Access Transformer (NeoGradle 7 style)
minecraft.accessTransformers.file 'src/main/resources/META-INF/accesstransformer.cfg'

// Parchment human-readable mappings
subsystems {
    parchment {
        minecraftVersion = "1.21.1"
        mappingsVersion = "2024.11.17"
    }
}

runs {
    configureEach {
        workingDirectory project.file("run/${name}")

        systemProperty 'neoforge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
        systemProperty 'neoforge.logging.console.level', 'debug'

        jvmArgument "-mixin.config=hemomancy.mixins.json"
        jvmArgument "-mixin.config=hemomancy.mna.mixins.json"
    }

    client {
        modSource project.sourceSets.main
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        programArguments.addAll '--username', 'Huto'
    }

    server {
        modSource project.sourceSets.main
        programArgument '--nogui'
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
    }

    data {
        modSource project.sourceSets.main
        workingDirectory project.file('run-data')
        programArguments.addAll '--mod', mod_id, '--all',
                '--output', file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath
    }
}


// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url "https://www.cursemaven.com" }
    maven { url = "https://maven.createmod.net" }    // Create, Ponder, Flywheel
    maven { url = "https://maven.tterrag.com" }       // Registrate
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
    maven {
        name = "Progwml6 maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.k-4u.nl"
    }
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com"          // JEI
    }
    flatDir { dir 'libs' }
}

dependencies {
    // ── Core: NeoForge (replaces ForgeGradle minecraft + forge dep) ──────────────
    implementation "net.neoforged:neoforge:${neoforge_version}"

    // ── TerraBlender – NeoForge 1.21.1 build ─────────────────────────────────────
    //implementation "com.github.glitchfiend:TerraBlender-neoforge:.21.1-4.1.0.8"

    // ── GeckoLib – NeoForge 1.21.1 build ─────────────────────────────────────────
    //implementation "software.bernie.geckolib:geckolib-neoforge-1.21.1-4.8.4"

    // ── HutosLib – requires NeoForge 1.21 recompile; use local libs/ until published ──
    //implementation "com.vincenthuto:hutoslib:6.0.0"

    // ── Curios – DISABLED: awaiting NeoForge 1.21.1 build ────────────────────────
    // TODO: re-enable once top.theillusivec4.curios:curios-neoforge:1.21.1+X is released
    // compileOnly "top.theillusivec4.curios:curios-neoforge:${minecraft_version}+${curios_version}"

    // ── JEI – DISABLED: awaiting NeoForge 1.21.1 build ───────────────────────────
    // TODO: re-enable once mezz.jei builds for 1.21.1+neoforge are published
    // compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    // runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // ── Mana and Artifice – NOT available on NeoForge 1.21 ───────────────────────
    // compat/mna is stub-gated behind ModList.isLoaded("mna") at runtime.
    // Do NOT uncomment until a NeoForge 1.21 MnA build exists.
    // implementation "curse.maven:mana-and-artifice-406360:XXXXXXX"

    // ── Magichem – DISABLED: needs NeoForge 1.21 build ───────────────────────────
    // implementation "com.aranaira:magichem:0.5.2-pre36"

    // ── The One Probe – DISABLED: awaiting NeoForge 1.21 build ──────────────────
    // implementation "curse.maven:the-one-probe-245211:XXXXXXX"

    // ── Dev tools (compileOnly / runtimeOnly) – DISABLED until 1.21 builds exist ─
    // implementation(...)  Create / Ponder / Flywheel / Registrate
    // implementation "com.direwolf20:buildinggadgets2:X.X.X"

    // ── MixinExtras ──────────────────────────────────────────────────────────────
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation "io.github.llamalad7:mixinextras-neoforge:0.4.1"

    // Mixin annotation processor
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neoforge_version       : neoforge_version,
            neoforge_version_range : neoforge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'hemomancy.mixins.json,hemomancy.mna.mixins.json'
        ])
    }
    // NOTE: NeoForge does NOT use reobfJar – jar is already Mojang-mapped at compile time
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
