plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

var replaceProperties = [
        minecraft_version       : minecraft_version,
        minecraft_version_range : minecraft_version_range,
        neo_version             : neo_version,
        neo_version_range       : neo_version_range,
        // Backward-compat alias used by existing neoforge.mods.toml placeholder.
        neoforge_version_range  : neo_version_range,
        loader_version_range    : loader_version_range,
        mod_id                  : mod_id,
        mod_name                : mod_name,
        mod_license             : mod_license,
        mod_version             : mod_version,
        mod_authors             : mod_authors,
        mod_description         : mod_description,
        pack_format_number      : pack_format_number,
]

tasks.named('processResources', ProcessResources).configure {
    // Keep src/main/resources as the authoritative copy when datagen outputs overlap.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

// ── Optional-dependency compat source exclusions ─────────────────────────────
// MnA (Mana and Artifice) has no NeoForge 1.21.1 build yet.
// Curios NeoForge 1.21.1 build is pending.
// Exclude these compat packages from compilation so the base mod builds
// without those optional deps. Re-enable each block once the corresponding
// compileOnly dep is declared above and the JAR is available.
sourceSets.main.java {
    exclude 'com/vincenthuto/hemomancy/compat/mna/**'
    exclude 'com/vincenthuto/hemomancy/compat/curios/**'
}

repositories {
    mavenCentral()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven/'
        content { includeGroup 'maven.modrinth' }
    }
}

// Development-only in-game scenarios and NeoForge GameTests. Keeping these in
// their own source set makes them available to dev runs without packaging them
// in the release jar.
sourceSets {
    gameTest {
        java.srcDir('src/gameTest/java')
        resources.srcDir('src/gameTest/resources')
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
}

base {
    archivesName = mod_id
}

def clientLocalRuntime = configurations.create('clientLocalRuntime')

// Mojang ships Java 21 to end users in 1.21, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = '1.21.1'
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            additionalRuntimeClasspathConfiguration.extendsFrom(clientLocalRuntime)
            jvmArguments.addAll("-Xms8G", "-Xmx24G")
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        alphaJourneyClient {
            client()
            gameDirectory = project.file('run-alpha-journey')
            additionalRuntimeClasspathConfiguration.extendsFrom(clientLocalRuntime)
            jvmArguments.addAll("-Xms8G", "-Xmx24G")
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            // The pilot tests deliberately reuse Mojang's one-block empty
            // template, so their template namespace is minecraft.
            systemProperty 'neoforge.enabledGameTestNamespaces', "${project.mod_id},minecraft"
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gameTest)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    gameTestImplementation.extendsFrom implementation
    gameTestRuntimeOnly.extendsFrom runtimeOnly, localRuntime
}

dependencies {
    // NeoForge is provided by the moddev plugin via the neoForge { version = ... } block above.

    // ── TerraBlender – NeoForge 1.21.1 build ─────────────────────────────────────
   // implementation "com.github.glitchfiend:TerraBlender-neoforge:${minecraft_version}-${terrablender_version}"
    implementation files("libs/TerraBlender-neoforge-${minecraft_version}-${terrablender_version}.jar")

    // ── GeckoLib – NeoForge 1.21.1 build ─────────────────────────────────────────
    //implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
  //  implementation files("libs/geckolib-neoforge-${minecraft_version}-${geckolib_version}.jar")

    add('clientLocalRuntime', files("libs/create-1.21.1-6.0.10.jar"))

    implementation files("libs/buildinggadgets2-1.3.9.jar")

    implementation files("libs/worldedit-mod-7.3.8.jar")
    implementation files ("libs/moonlight-neoforge-1.21.1-3.0.20.jar")

    implementation files ("libs/dummmmmmy-1.21-2.0.12-neoforge.jar")

    implementation files ("libs/theoneprobe-1.21_neo-12.0.8.jar")
    implementation files ("libs/mna-3.1.11-neoforge.1.21.1.0.jar")


    // Optional client-side LOD testing mod. Disabled for alpha smoke tests because
    // 3.0.3-b crashes during its startup updater on NeoForge dev launch.
  // implementation files("libs/DistantHorizons-3.0.3-b-1.21.1-fabric-neoforge.jar")


    // ── HutosLib – use the local workspace build when available ─────────────────
    implementation "com.vincenthuto.hutoslib:hutoslib:${hutoslib_version}"

    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    implementation "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    implementation files("libs/jei-1.21.1-neoforge-19.27.0.340.jar")


    // ── Mana and Artifice – NOT available on NeoForge 1.21 ───────────────────────
    // compat/mna is stub-gated behind ModList.isLoaded("mna") at runtime.
    // Do NOT uncomment until a NeoForge 1.21 MnA build exists.
    // implementation "curse.maven:mana-and-artifice-406360:XXXXXXX"

    // ── Magichem – DISABLED: needs NeoForge 1.21 build ───────────────────────────
    // implementation "com.aranaira:magichem:0.5.2-pre36"

    // ── The One Probe – DISABLED: awaiting NeoForge 1.21 build ──────────────────
    // implementation "curse.maven:the-one-probe-245211:XXXXXXX"

    // ── Dev tools (compileOnly / runtimeOnly) – DISABLED until 1.21 builds exist ─
    // implementation(...)  Create / Ponder / Flywheel / Registrate
    // implementation "com.direwolf20:buildinggadgets2:X.X.X"

    // ── MixinExtras ──────────────────────────────────────────────────────────────
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation "io.github.llamalad7:mixinextras-neoforge:0.4.1"

    // Mixin annotation processor
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation files(layout.buildDirectory.file("moddev/artifacts/neoforge-${neo_version}-merged.jar"))
    testImplementation "net.neoforged:minecraft-dependencies:${minecraft_version}"
    testRuntimeOnly 'net.neoforged.fancymodloader:loader:4.0.42'
}
// Template expansion is handled directly in processResources.

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs << '-Xlint:deprecation' << '-Xlint:unchecked'
}

tasks.named('test', Test).configure {
    dependsOn tasks.named('createMinecraftArtifacts')
    useJUnitPlatform()
}

tasks.named('runGameTestServer').configure {
    mustRunAfter tasks.named('test')
}

tasks.register('verifyGameTestResourceLog') {
    group = 'verification'
    description = 'Fails when the dedicated server reports Hemomancy resource errors.'
    dependsOn tasks.named('runGameTestServer')

    doLast {
        File gameTestLog = layout.projectDirectory.file('run/logs/latest.log').asFile
        if (!gameTestLog.isFile()) {
            throw new GradleException("GameTest log was not created: ${gameTestLog}")
        }

        List<String> logLines = gameTestLog.readLines('UTF-8')
        if (!logLines.any { line -> line.contains('required tests passed') }) {
            throw new GradleException('GameTest log does not contain a successful required-test summary.')
        }

        List<String> hemomancyErrors = logLines.findAll { line ->
            line.contains('/ERROR]') && line.toLowerCase(Locale.ROOT).contains('hemomancy')
        }
        if (!hemomancyErrors.isEmpty()) {
            throw new GradleException(
                    "GameTest server reported Hemomancy resource errors:\n" + hemomancyErrors.join('\n'))
        }
    }
}

tasks.register('alphaCheck') {
    group = 'verification'
    description = 'Runs JVM contracts, dedicated Hemomancy GameTests, and the runtime resource-error gate.'
    dependsOn tasks.named('test'), tasks.named('verifyGameTestResourceLog')
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
