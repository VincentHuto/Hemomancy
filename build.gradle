plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
    // Preserve authoring archives in source without exposing them to resource-pack scanners.
    exclude('assets/hemomancy/**/* - Copy.*')
    exclude('assets/hemomancy/models/entity/bbmodel/imports/**')
    exclude('assets/hemomancy/textures/item/sanguine formation/**')
    exclude('assets/hemomancy/sounds/**/*.mp3')
    exclude('assets/hemomancy/sounds/entity/colin/OLD*.ogg')
    exclude('assets/hemomancy/shaders/program/ShaderBasicMethods.txt')
    exclude('assets/hemomancy/shaders/program/HowToShaderTileEntities')
    exclude('assets/hemomancy/font/OFL-Jacquard24.txt')
    exclude('assets/hemomancy/textures/block/old/infected_cap.png') // Unreferenced archive has a non-PNG header.
    exclude('assets/hemomancy/textures/entity/drudge/model_drudge_grey_old (*).png')
    exclude('assets/hemomancy/textures/gui/microscope/README.md')
    exclude('assets/hemomancy/textures/gui/old/BORDER.png')
}

var replaceProperties = [
        minecraft_version       : minecraft_version,
        minecraft_version_range : minecraft_version_range,
        neo_version             : neo_version,
        neo_version_range       : neo_version_range,
        // Backward-compat alias used by existing neoforge.mods.toml placeholder.
        neoforge_version_range  : neo_version_range,
        loader_version_range    : loader_version_range,
        mod_id                  : mod_id,
        mod_name                : mod_name,
        mod_license             : mod_license,
        mod_version             : mod_version,
        mod_authors             : mod_authors,
        mod_description         : mod_description,
        pack_format_number      : pack_format_number,
]

tasks.named('processResources', ProcessResources).configure {
    // Keep src/main/resources as the authoritative copy when datagen outputs overlap.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from('src/main/resources/assets/hemomancy/font/OFL-Jacquard24.txt') {
        into 'META-INF/licenses/hemomancy'
    }
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

// ── Optional-dependency compat source exclusions ─────────────────────────────
// MnA (Mana and Artifice) has no NeoForge 1.21.1 build yet.
// Curios NeoForge 1.21.1 build is pending.
// Exclude these compat packages from compilation so the base mod builds
// without those optional deps. Re-enable each block once the corresponding
// compileOnly dep is declared above and the JAR is available.
sourceSets.main.java {
    exclude 'com/vincenthuto/hemomancy/compat/mna/**'
    exclude 'com/vincenthuto/hemomancy/compat/curios/**'
}

repositories {
    mavenCentral()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven/'
        content { includeGroup 'maven.modrinth' }
    }
}

// Development-only in-game scenarios and NeoForge GameTests. Keeping these in
// their own source set makes them available to dev runs without packaging them
// in the release jar.
sourceSets {
    gameTest {
        java.srcDir('src/gameTest/java')
        resources.setSrcDirs(['src/gameTest/resources'])
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
}

base {
    archivesName = mod_id
}

def clientLocalRuntime = configurations.create('clientLocalRuntime')

// Mojang ships Java 21 to end users in 1.21, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = '1.21.1'
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            additionalRuntimeClasspathConfiguration.extendsFrom(clientLocalRuntime)
            jvmArguments.addAll("-Xms8G", "-Xmx24G")
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        bookKitReviewClient {
            client()
            gameDirectory = project.file('build/book-kit-client')
            additionalRuntimeClasspathConfiguration.extendsFrom(clientLocalRuntime)
            jvmArguments.addAll('-Xms2G', '-Xmx6G')
            systemProperty 'hemomancy.gameplayDriver', 'true'
            systemProperty 'hemomancy.bookKitReview', 'true'
            programArguments.addAll '--username', 'BookKitReview', '--width', '1280', '--height', '900'
        }

        bookKitPeerClient {
            client()
            gameDirectory = project.file('build/book-kit-peer/book-kit-client')
            additionalRuntimeClasspathConfiguration.extendsFrom(clientLocalRuntime)
            jvmArguments.addAll('-Xms2G', '-Xmx6G')
            systemProperty 'hemomancy.gameplayDriver', 'true'
            systemProperty 'hemomancy.bookKitReview', 'true'
            programArguments.addAll '--username', 'BookKitPeer', '--width', '1000', '--height', '800'
        }

        scriptoriumReviewClient {
            client()
            gameDirectory = project.file('build/scriptorium-client')
            additionalRuntimeClasspathConfiguration.extendsFrom(clientLocalRuntime)
            jvmArguments.addAll("-Xms2G", "-Xmx6G")
            programArguments.addAll '--username', 'ScriptoriumReview', '--width', '1280', '--height', '720'
        }

        alphaJourneyClient {
            client()
            gameDirectory = project.file('run-alpha-journey')
            additionalRuntimeClasspathConfiguration.extendsFrom(clientLocalRuntime)
            jvmArguments.addAll("-Xms8G", "-Xmx24G")
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        phlegethonticReviewClient {
            client()
            gameDirectory = project.file('build/phlegethontic-client')
            additionalRuntimeClasspathConfiguration.extendsFrom(clientLocalRuntime)
            jvmArguments.addAll("-Xms2G", "-Xmx6G")
            systemProperty 'hemomancy.phlegethontic.clientReview', 'true'
            programArguments.addAll '--username', 'IchorReview', '--quickPlaySingleplayer', 'Phlegethontic Final Review'
        }

        pelagicReviewClient {
            client()
            gameDirectory = project.file('build/pelagic-client')
            additionalRuntimeClasspathConfiguration.extendsFrom(clientLocalRuntime)
            jvmArguments.addAll '-Xms2G', '-Xmx6G'
            systemProperty 'hemomancy.pelagic.clientReview', providers.gradleProperty('pelagicEcologyReview').isPresent() ? 'false' : 'true'
            systemProperty 'hemomancy.pelagic.ecologyClientReview', providers.gradleProperty('pelagicEcologyReview').getOrElse('false')
            systemProperty 'hemomancy.osteophage.clientReview', providers.gradleProperty('osteophageReview').getOrElse('false')
            systemProperty 'hemomancy.pelagic.reviewStartScene', providers.gradleProperty('pelagicReviewStartScene').getOrElse('0')
            systemProperty 'hemomancy.gameplayDriver', 'true'
            programArguments.addAll '--username', 'PelagicReview', '--quickPlaySingleplayer', providers.gradleProperty('pelagicReviewWorld').getOrElse('Pelagic Review'), '--width', '1280', '--height', '800'
        }

        phlegethonticObserverClient {
            client()
            gameDirectory = project.file('build/phlegethontic-observer')
            additionalRuntimeClasspathConfiguration.extendsFrom(clientLocalRuntime)
            jvmArguments.addAll("-Xms2G", "-Xmx6G")
            systemProperty 'hemomancy.phlegethontic.clientReview', 'true'
            programArguments.addAll '--username', 'IchorObserver', '--quickPlayMultiplayer', 'localhost:25566'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        antecedentReviewClient {
            client()
            gameDirectory = project.file('build/antecedent-client')
            additionalRuntimeClasspathConfiguration.extendsFrom(clientLocalRuntime)
            jvmArguments.addAll("-Xms2G", "-Xmx5G")
            systemProperty 'hemomancy.gameplayDriver', 'true'
            systemProperty 'hemomancy.antecedentReview', 'true'
            programArguments.addAll '--username', 'AntecedentReview'
        }

        axonalReviewClient {
            client()
            gameDirectory = project.file('build/axonal-client')
            additionalRuntimeClasspathConfiguration.extendsFrom(clientLocalRuntime)
            jvmArguments.addAll('-Xms2G', '-Xmx5G')
            systemProperty 'hemomancy.gameplayDriver', 'true'
            systemProperty 'hemomancy.axonalReview', 'true'
            programArguments.addAll '--username', 'AxonalReview'
        }

        naeglerophaeonReviewClient {
            client()
            gameDirectory = project.file('build/naeglerophaeon-client')
            additionalRuntimeClasspathConfiguration.extendsFrom(clientLocalRuntime)
            jvmArguments.addAll('-Xms2G', '-Xmx6G')
            systemProperty 'hemomancy.gameplayDriver', 'true'
            systemProperty 'hemomancy.naeglerophaeonReview', 'true'
            programArguments.addAll '--username', 'MembraneReview'
        }

        successionReviewClient {
            client()
            gameDirectory = project.file('build/succession-client')
            additionalRuntimeClasspathConfiguration.extendsFrom(clientLocalRuntime)
            jvmArguments.addAll("-Xms2G", "-Xmx6G")
            systemProperty 'hemomancy.gameplayDriver', 'true'
            systemProperty 'hemomancy.successionReview', 'true'
            programArguments.addAll '--username', 'SuccessionReview'
        }

        successionObserverClient {
            client()
            gameDirectory = project.file('build/succession-observer')
            additionalRuntimeClasspathConfiguration.extendsFrom(clientLocalRuntime)
            jvmArguments.addAll("-Xms2G", "-Xmx4G")
            systemProperty 'hemomancy.gameplayDriver', 'true'
            programArguments.addAll '--username', 'SucObserver', '--quickPlayMultiplayer', 'localhost:25568'
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            systemProperty 'hemomancy.chamberLoadedValidation', providers.gradleProperty('chamberLoadedValidation').getOrElse('false')
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gameTest)
        }
    }
}

apply from: 'gradle/game-tests.gradle'

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    gameTestImplementation.extendsFrom implementation
    gameTestRuntimeOnly.extendsFrom runtimeOnly, localRuntime
}

dependencies {
    // NeoForge is provided by the moddev plugin via the neoForge { version = ... } block above.


    //Building
    add('clientLocalRuntime', files("libs/create-1.21.1-6.0.10.jar"))
    implementation files("libs/buildinggadgets2-1.3.9.jar")
    implementation files("libs/worldedit-mod-7.3.8.jar")


   //Testing
    implementation files ("libs/moonlight-neoforge-1.21.1-3.0.20.jar")
    implementation files ("libs/theoneprobe-1.21_neo-12.0.8.jar")
    implementation files ("libs/dummmmmmy-1.21-2.0.12-neoforge.jar")
    implementation files("libs/jei-1.21.1-neoforge-19.27.0.340.jar")
    // Disabled: Distant Horizons crashes the GameTest server during startup.
    // implementation files("libs/DistantHorizons-3.3.3-1.21.1-fabric-neoforge.jar")

    //libraries
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    //implementation files("libs/geckolib-neoforge-${minecraft_version}-${geckolib_version}.jar")
    implementation "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    //Astral
    implementation files("libs/observerlib-1.10.3.jar")
    implementation files ("libs/AstralSorcery-2.0.0.3.jar")


    //Demonology
   // implementation files("libs/Demonology-1.0.1+NeoForge-1.21.1.jar")

    //Thaum
   //implementation files ("libs/thaumaturge-1.21.1-NeoForge-1.0.2.jar")

    //Mna
    implementation files ("libs/mna-3.1.11-neoforge.1.21.1.0.jar")

    // ── HutosLib – use the local workspace build when available ─────────────────
    implementation "com.vincenthuto.hutoslib:hutoslib:${hutoslib_version}"
    // ── TerraBlender – NeoForge 1.21.1 build ─────────────────────────────────────
    // implementation "com.github.glitchfiend:TerraBlender-neoforge:${minecraft_version}-${terrablender_version}"
    implementation files("libs/TerraBlender-neoforge-${minecraft_version}-${terrablender_version}.jar")

    // ── Magichem – DISABLED: needs NeoForge 1.21 build ───────────────────────────
    // implementation "com.aranaira:magichem:0.5.2-pre36"

    // ── MixinExtras ──────────────────────────────────────────────────────────────
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation "io.github.llamalad7:mixinextras-neoforge:0.4.1"

    // Mixin annotation processor
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation files(layout.buildDirectory.file("moddev/artifacts/neoforge-${neo_version}-merged.jar"))
    testImplementation "net.neoforged:minecraft-dependencies:${minecraft_version}"
    testRuntimeOnly 'net.neoforged.fancymodloader:loader:4.0.44'
}
// Template expansion is handled directly in processResources.

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs << '-Xlint:deprecation' << '-Xlint:unchecked'
}

tasks.named('test', Test).configure {
    dependsOn tasks.named('createMinecraftArtifacts')
    useJUnitPlatform()
}

tasks.named('runGameTestServer').configure {
    mustRunAfter tasks.named('test')
}

tasks.named('runPhlegethonticValidationServer').configure {
    doFirst {
        File netherRegions = neoForge.runs.phlegethonticValidationServer.gameDirectory.get().dir('world/DIM-1/region').asFile
        if (netherRegions.isDirectory() && netherRegions.listFiles().any { it.name.endsWith('.mca') }) {
            throw new GradleException('Fresh Nether validation requires a new -PphlegethonticRun name; this run already contains generated chunks.')
        }
    }
}

tasks.register('verifyGameTestResourceLog') {
    group = 'verification'
    description = 'Fails when the dedicated server reports Hemomancy resource errors.'
    dependsOn tasks.named('runGameTestServer')

    doLast {
        File gameTestLog = neoForge.runs.gameTestServer.gameDirectory.get().file('logs/latest.log').asFile
        if (!gameTestLog.isFile()) {
            throw new GradleException("GameTest log was not created: ${gameTestLog}")
        }

        List<String> logLines = gameTestLog.readLines('UTF-8')
        if (!logLines.any { line -> line.contains('required tests passed') }) {
            throw new GradleException('GameTest log does not contain a successful required-test summary.')
        }

        List<String> hemomancyErrors = logLines.findAll { line ->
            line.contains('/ERROR]') && line.toLowerCase(Locale.ROOT).contains('hemomancy')
        }
        if (!hemomancyErrors.isEmpty()) {
            throw new GradleException(
                    "GameTest server reported Hemomancy resource errors:\n" + hemomancyErrors.join('\n'))
        }
    }
}

tasks.register('verifyPackagedClientResources') {
    group = 'verification'
    description = 'Reject invalid runtime asset paths and PNG headers; preserve the bundled font license.'
    dependsOn tasks.named('jar')
    doLast {
        def problems = []
        def pngSignature = [137, 80, 78, 71, 13, 10, 26, 10].collect { (byte) it } as byte[]
        def archive = tasks.named('jar').get().archiveFile.get().asFile
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            zip.entries().each { entry ->
                if (!entry.directory && entry.name.startsWith('assets/')) {
                    if (!(entry.name ==~ /[a-z0-9\/._-]+/)) problems.add("Invalid resource path: ${entry.name}")
                    if (entry.name.endsWith('.png')) {
                        zip.getInputStream(entry).withCloseable { stream ->
                            if (!java.util.Arrays.equals(pngSignature, stream.readNBytes(8)))
                                problems.add("Invalid PNG header: ${entry.name}")
                        }
                    }
                }
            }
            def license = zip.getEntry('META-INF/licenses/hemomancy/OFL-Jacquard24.txt')
            if (license == null) problems.add('Missing Jacquard font license')
            else zip.getInputStream(license).withCloseable { stream ->
                if (!java.util.Arrays.equals(stream.readAllBytes(), file('src/main/resources/assets/hemomancy/font/OFL-Jacquard24.txt').bytes))
                    problems.add('Jacquard font license content changed')
            }
        }

        if (!problems.isEmpty()) throw new GradleException(problems.join('\n'))
        logger.lifecycle('Packaged client resource paths, PNG headers and font license verified.')
    }
}

tasks.named('runPelagicValidationServer').configure {
    doFirst {
        File regions = neoForge.runs.pelagicValidationServer.gameDirectory.get().dir('world/region').asFile
        if (regions.isDirectory() && regions.listFiles().any { it.name.endsWith('.mca') }) {
            throw new GradleException('Fresh ocean validation requires a new -PpelagicRun name.')
        }
    }
}

tasks.register('alphaCheck') {
    group = 'verification'
    description = 'Runs JVM contracts, dedicated GameTests, runtime resource errors and packaged client resource checks.'
    dependsOn tasks.named('test'), tasks.named('verifyGameTestResourceLog'), tasks.named('verifyPackagedClientResources')
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
